o interview relatives and record their life stories well.","records":["Oral history"],"place":["Worldwide"],"topic":["Life stories","Preservation"],"format":["Guide"],"access":["Free"]},{"t":"Putting ancestors’ lives in context","u":"https://organizeyourfamilyhistory.com/putting-your-ancestors-lives-in-context/","d":"Turn records into a narrative of a life.","records":[],"place":["Worldwide"],"topic":["Life stories","Social history"],"format":["Guide"],"access":["Free"]},{"t":"Geneanet historical chronologies","u":"https://en.geneanet.org/genealogyblog/post/2025/06/new-historical-chronologies","d":"Historical events alongside your ancestors’ timelines.","records":[],"place":["Worldwide"],"topic":["Context","Social history"],"format":["Tool"],"access":["Free"]},{"t":"MyHeritage Wiki: social history in genealogy","u":"https://www.myheritage.com/wiki/How_to_use_social_history_in_genealogy_research","d":"Use social history to understand ancestors’ lives.","records":[],"place":["Worldwide"],"topic":["Social history"],"format":["Guide"],"access":["Free"]}]}</script>
<script type="application/json" id="bod-les">{"levels":[{"n":1,"k":"Beginner","t":"First steps","d":"Start from yourself, talk to the living, and learn the records almost every family left behind."},{"n":2,"k":"Intermediate","t":"Reading the records","d":"Census pages, parish registers, passenger lists and wills: what each one really says, and what it leaves out."},{"n":3,"k":"Advanced","t":"Thinking like a genealogist","d":"Weigh evidence, cite as you go, resolve conflicts and plan your research instead of wandering."},{"n":4,"k":"Expert","t":"Breaking through","d":"Clusters, unindexed records, old handwriting and DNA: the techniques that open brick walls, and how to prove what you find."}],"lessons":[{"id":"known","level":1,"title":"Start with what you know","dek":"Every family history is built backwards, one proven generation at a time, starting with you.","min":7,"blocks":[{"p":"The most common beginner's mistake is to start with a famous name, a family legend or a distant ancestor and work forwards. It feels exciting, but it almost always ends with someone else's family attached to yours. Researchers who get it right do the opposite: they start with what they can **prove**, and step back one generation at a time."},{"h":"Work from the known to the unknown"},{"p":"Begin with yourself: your birth, your parents' names, where and when they married. Then do the same for each parent, then each grandparent. Each new person should be connected to the last by a record that names them both: a birth certificate naming the parents, a marriage record naming the fathers, a census listing a child in a household."},{"p":"It sounds slow. It is the fastest route in the end, because every step stands on the one before it."},{"call":"tip","t":"One generation, three records","p":"Before you add a new generation, aim to find at least three records for the person you are standing on: something for their birth, their marriage and their death. Those three usually name the parents you need next."},{"h":"Raid the house first"},{"p":"The best records are often in a drawer. Families keep certificates, letters, funeral cards, photographs with names on the back, and bibles with births written inside the cover. Tick off what you can find, or ask relatives to look."},{"check":{"prompt":"Home sources to look for","items":["Birth, marriage and death certificates","Funeral cards, obituaries and newspaper cuttings","A family bible or prayer book with handwritten dates","Letters, postcards and diaries","Photographs, especially with writing on the back","Military papers, medals and service books","School reports, apprenticeship papers, union cards","Passports, naturalization papers, ship tickets","Address books and Christmas card lists"]}},{"h":"Write down where every fact came from"},{"p":"From day one, note where each fact came from: “Grandma, conversation, March 2026” or “Birth certificate, original in Mum's box.” It feels fussy until the day two sources disagree and you need to know which one to trust. In this app, add the record under **Records** on a person's profile and link it to the facts it supports."},{"quiz":{"q":"You find a website tree claiming your great-grandfather descends from a medieval knight. What should you do first?","o":["Add the knight and his line to your tree, then check it later","Keep researching back from yourself, and treat the claim as a lead to test","Ignore it: online trees are always wrong"],"a":1,"why":"Online trees are clues, not proof. Some are excellent, many copy each other's mistakes. Keep building back from what you can prove, and see whether your evidence eventually meets theirs."}},{"tool":"yourtree"}],"takeaways":["Start with yourself and step back one proven generation at a time.","Collect home sources before searching online.","Record where every fact came from, from the very first day."],"lib":["The Family History Guide","FamilySearch","FamilySearch Research Wiki","TNA: Family history research guides","National Archives (NARA): Genealogy","Cyndi’s List"]},{"id":"living","level":1,"title":"Ask the living","dek":"Your oldest relatives are an archive that closes. A good interview captures names, places and stories no record holds.","min":8,"blocks":[{"p":"Records tell you *when* and *where*. People tell you *why*. Your relatives remember nicknames, the street a family lived on, which cousin emigrated and why nobody spoke to Uncle Frank. Those memories are often the clue that unlocks a record search years later."},{"h":"Prepare, then listen"},{"p":"Before you sit down, look at what you already know about the person's family, and bring a few photographs. Pictures are the best prompts there are: people remember far more when they have a face in front of them."},{"list":["Ask permission to record, and record the whole conversation.","Start with their own life, not the distant past. People warm up talking about themselves.","Ask one question at a time, then wait. Silence is when the best stories come.","Ask for names and places to be spelled out.","Keep sessions short, under an hour, and come back."]},{"h":"Open questions get stories"},{"p":"A closed question gets a yes or a no. A leading question gets the answer you suggested. An open question gets a story, and stories are full of clues."},{"sort":{"prompt":"Sort each question. Tap the type you think it is.","cats":["Open","Closed","Leading"],"items":[["“What was a normal Sunday like when you were small?”",0,"Open: it invites a description, with people, places and routines."],["“Was your grandmother born in Ireland?”",1,"Closed: it can be answered with one word. Try “Where did your grandmother grow up?”"],["“Your father fought at the Somme, didn't he?”",2,"Leading: it plants the answer. They may agree to be polite."],["“Tell me about the house you grew up in.”",0,"Open: houses bring back neighbours, streets and who lived where."],["“Did the family come over in 1912?”",1,"Closed: try “How did the family come to live here?”"],["“I suppose they were very poor then?”",2,"Leading: let them describe it in their own words."]]}},{"h":"Memories are evidence, not proof"},{"p":"Family stories shrink, stretch and travel. A grandfather who “came from Dublin” may have sailed from Dublin but been born in County Mayo. A famous relative is often a cousin, not a parent. Write the story down exactly as told, then test it against records. The kernel is usually true; the details drift."},{"call":"watch","t":"The story about the name change","p":"“Our name was changed at Ellis Island” is one of the most common family stories, and it is almost never true. Passenger lists were written at the port of departure, and US immigration officials didn't rename people. Changes usually happened later, by choice. Lesson 7 covers this."},{"quiz":{"q":"Your aunt says her grandmother was “born in Galway in 1880.” What is the best way to record this?","o":["Enter birth: 1880, Galway, and move on","Enter it, and note the source: “Aunt Joan, interview 2026, said ‘born in Galway in 1880’”","Don't enter it until you have a certificate"],"a":1,"why":"Capture it, with exactly who said it and when. It's a valuable lead, and recording its source tells your future self how much weight it can carry."}}],"takeaways":["Interview the oldest relatives first, and record it.","Use photographs as prompts, and ask open questions.","Treat every family story as a lead to test, and note who told it."],"lib":["Oral History Association: best practices","StoryCorps Archive","Veterans History Project (LOC)","British Library Sounds: oral history","Library of Congress: Personal digital archiving"]},{"id":"core","level":1,"title":"The core records","dek":"Births, marriages, deaths, censuses and church registers will carry you most of the way back to 1800.","min":9,"blocks":[{"p":"Thousands of record types exist, but three families of records do most of the work for most researchers. Knowing what each one contains, and when it starts, tells you where to look first."},{"h":"Civil registration: births, marriages, deaths"},{"p":"Governments began registering births, marriages and deaths at different times. Before that date you will be relying on church records instead. Civil records are usually the most reliable for dates, and they name parents."},{"table":{"head":["Place","Civil registration from"],"rows":[["France","1792"],["Netherlands","1811"],["England & Wales","1 July 1837"],["Scotland","1855"],["Ireland","1864 (non-Catholic marriages from 1845)"],["Hungary","1 October 1895"],["United States","By state, mostly 1880s–1920s; some towns much earlier"]]}},{"p":"In England and Wales, the indexes are free on FreeBMD and the General Register Office site, and you order certificates from the GRO. Scotland's are on ScotlandsPeople, and Ireland's on IrishGenealogy.ie."},{"h":"The census: households, every ten years"},{"p":"A census is a snapshot of a household on one night. It places a family in a street, lists the children (including ones who died young and left no other trace), and gives ages, birthplaces and occupations. Following a family census by census is the backbone of most research."},{"h":"Church registers: before the state took over"},{"p":"Before civil registration, churches recorded baptisms, marriages and burials. They are the main source for the 1500s to the 1800s across Europe and the Americas. Note that a baptism is not a birth: it might be days, months or even years later."},{"sort":{"prompt":"Which record would you reach for first? Tap one for each question.","cats":["Civil","Census","Church"],"items":[["Who were the parents of a woman married in Bolton in 1868?",0,"Civil: an English marriage certificate from 1837 onwards names both fathers."],["Which children lived with Thomas and Eliza in 1901?",1,"Census: the 1901 census lists every person in the household that night."],["When was a child baptised in Wigan in 1790?",2,"Church: in England, there's no civil registration before July 1837."],["What was James Ashworth's job in 1871?",1,"Census: occupations are listed for each adult."],["Exactly when did someone die in Ohio in 1938?",0,"Civil: Ohio state death certificates began in December 1908."],["Who were the godparents at a Hungarian christening in 1850?",2,"Church: baptism registers name sponsors, and state registration didn't start in Hungary until 1895."]]}},{"call":"tip","t":"Indexes point, images prove","p":"Most websites show an index first: a typed summary of a record. Indexes are wonderful for finding things, but they contain mistakes. Always look at the image of the original page when you can. It often holds more than the index does."}],"takeaways":["Civil records, censuses and church registers do most of the work.","Know when civil registration starts in each place you research.","Use indexes to find records, and images to read them."],"lib":["FreeBMD","GRO certificate ordering & indexes","ScotlandsPeople","IrishGenealogy.ie","CDC: Where to Write for Vital Records","FamilySearch","FreeREG"]},{"id":"search","level":1,"title":"Search like a researcher","dek":"Names were spelled however the clerk heard them. Learn to search for the person, not the spelling.","min":9,"blocks":[{"p":"Most of your ancestors could not read the forms that recorded them. The clerk wrote down what he heard, in the spelling he thought was right. One family can appear as Ashworth, Ashwith, Ashwort and Ashforth in the same decade. Searching only for the “correct” spelling means missing most of the records."},{"h":"Start broad, then narrow"},{"list":["Search the surname alone, with a place and a date range, before adding a first name.","Give birth years a range of two to five years either side. Ages drift.","Try first names as initials, nicknames (Polly for Mary, Peggy for Margaret) and middle names.","Use wildcards where sites allow: Ash*th finds Ashworth and Ashwith.","Search for a parent, a sibling or a spouse instead. Find any one of them and you find the household."]},{"h":"Soundex: grouping names by sound"},{"p":"Soundex is a code patented in 1918 and used in the 1930s to index the US census. It reduces a surname to its first letter and three digits for the consonant sounds that follow, so names that sound alike share a code. Many sites still use it, and it's a handy way to think up spellings you'd never have guessed."},{"tool":"soundex"},{"call":"watch","t":"Women's names change","p":"Women usually appear under their father's surname before marriage and their husband's after, and sometimes under a second husband's later. When you lose a woman between censuses, look for a marriage."},{"h":"When the index fails, browse"},{"p":"Not everything is indexed, and indexes have gaps. If you know the parish and the year, browse the page images directly, a page at a time. It's slower, and it's how many brick walls fall. FamilySearch has millions of unindexed images reachable only through its catalog (Lesson 14)."},{"quiz":{"q":"You can't find Ann Crook, born about 1848, in the 1851 census. Which search is most likely to succeed?","o":["Ann Crook, born 1848 exactly, Wigan","Surname Cr*k, born 1845–1851, Lancashire, with no first name","Ann Crook, born 1848, anywhere in the world"],"a":1,"why":"A wildcard surname catches Crook as well as misreadings like Crock or Cruck. A date range absorbs age errors. Dropping the first name finds the household even if she's listed as Hannah or Nancy."}}],"takeaways":["Search for the household, not just the person.","Use date ranges, wildcards and variant spellings.","When indexes fail, browse the images."],"lib":["Steve Morse One-Step tools","FamilySearch","Findmypast","FreeCEN","Genealogy Tip of the Day","FamilySearch Catalog"]},{"id":"census","level":2,"title":"Reading a census","dek":"One line of a census page holds half a dozen clues. Learn to read every column, and to distrust the ages.","min":10,"blocks":[{"p":"Every census asks slightly different questions, but they share a shape: an address, then one line per person. Each column is a separate clue, and some are much more reliable than others."},{"h":"A page from 1881"},{"p":"Here is an invented entry for the example family, laid out like a page from the 1881 census of England. Tap any underlined cell to see what it tells you."},{"census":{"cap":"Example record · 1881 census · 14 Back Cotton Street, Bolton, Lancashire","cols":["Name","Relation","Condition","Age","Occupation","Where born"],"rows":[[["James Ashworth","Each line is one person present on census night, 3 April 1881. Someone working away, at sea or in hospital will be listed wherever they were."],["Head","The head of household. Every other relation is relative to him or her."],["Mar","Married. ‘Unm’ is unmarried, ‘Wid’ widowed."],["41","Ages are only as good as the person answering. Expect drift of a year or two between censuses, sometimes more."],["Cotton spinner","Occupations point to other records: trade union books, factory records, apprenticeship papers."],["Lancashire, Bolton","Birthplace is a strong clue, but people sometimes gave the nearest town, or the place they grew up rather than where they were born."]],[["Mary Ashworth","Listed under her married name. Her maiden name, Holt, appears on the marriage record and her children's birth certificates."],["Wife","Relationships to the head were first recorded in England in 1851, and in the US in 1880."],["Mar",""],["39","Compare ages across censuses. A woman who ages only eight years in a decade is common: wives were often recorded younger."],["","A blank doesn't mean she didn't work. Women's paid work, especially at home, was often left out."],["Lancashire, Bolton",""]],[["Thomas Ashworth","Children are listed oldest first, usually. A gap of several years between children may hide one who died."],["Son",""],["",""],["12","Thomas, born 1868, should be 12 or 13 here. This one fits."],["Scholar","‘Scholar’ means at school. In mill towns, children of this age might also be ‘half-timers’, splitting the day between school and the mill."],["Lancashire, Bolton",""]],[["Hannah Ashworth","A widowed grandmother living with the family is a gift: she links this household to the generation before."],["Mother","Mother of the head, so James's mother. This places Hannah, born about 1814, in the tree."],["Wid","Widowed: her husband John died before 1881. Search for his death between the last census he appears in and this one."],["67",""],["Annuitant","Living on a small income or pension."],["Lancashire, Bury","Born in Bury, not Bolton. Her baptism and marriage may be there."]]]}},{"h":"Ages drift, and sometimes leap"},{"p":"People didn't always know their exact age, and whoever answered the door gave the information for everyone. In the 1841 census of England and Wales, enumerators were told to round the ages of anyone over 15 down to the nearest five, so a 38-year-old appears as 35."},{"quiz":{"q":"Mary Ashworth is 29 in 1871, 39 in 1881 and 47 in 1891. What's the most reasonable conclusion?","o":["These are probably three different Marys","Normal drift: she was born about 1842, and the 1891 age is a little off","The 1891 census is the most recent, so it must be right"],"a":1,"why":"Ages that are consistent in two censuses and off by a few years in a third are normal. Look for her baptism or birth registration to settle it, and keep noting the variations."}},{"h":"Which censuses exist"},{"table":{"head":["Country","What survives"],"rows":[["England & Wales","1841–1921, every ten years. Names everyone from 1841; relationships from 1851. 1931 was destroyed in 1942; there was no 1941 census, but the 1939 Register fills the gap."],["Scotland","1841–1921, on ScotlandsPeople."],["Ireland","1901 and 1911 survive almost complete. Most of the 1800s is lost; see Griffith's Valuation instead."],["United States","Every ten years from 1790. Names everyone from 1850; relationships from 1880. Most of 1890 burned in 1921. Released after 72 years, so 1950 is the latest."],["Canada","1851 onwards, with gaps; 1931 released in 2023."]]}},{"call":"pro","t":"Read the whole page","p":"Always read the pages before and after your family. Relatives often lived on the same street, and the neighbours may be the in-laws you haven't found yet."}],"takeaways":["Every column is a separate clue with its own reliability.","Ages and birthplaces drift. Look for consistency across several censuses.","Read the neighbours: families clustered."],"lib":["FreeCEN","National Archives of Ireland: Census 1901 & 1911","1950 Census (NARA)","Census ED finder (One-Step)","Automated Genealogy","IPUMS USA"]},{"id":"parish","level":2,"title":"Parish registers and old dates","dek":"Before the state kept records, the church did. Learn their language, their gaps, and the calendar they used.","min":10,"blocks":[{"p":"Church registers are the deepest well in family history. In England some go back to 1538; in much of Catholic Europe to the late 1500s. They're also where research gets harder: entries are shorter, often in Latin, and written in hands you'll need practice to read."},{"h":"What each register gives you"},{"list":["**Baptisms** give the child's name, the baptism date, and usually the father. Later registers add the mother, an address and the father's trade. Catholic and Lutheran registers often name godparents too.","**Marriages** give the couple, the date, and sometimes their parishes and witnesses. Before civil registration, they rarely name parents.","**Banns** were read on three Sundays before a wedding, in the parishes of both bride and groom. A banns entry can tell you where the other partner came from.","**Burials** may give only a name and date. The age and residence, when given, help tell people with the same name apart."]},{"h":"Latin for genealogists"},{"p":"Catholic registers across Europe, and some early Anglican ones, were kept in Latin. You don't need to learn the language, just about forty words. Tap a card to turn it over."},{"flip":{"cards":[["natus, nata","born"],["baptizatus","baptized"],["filius / filia","son / daughter"],["uxor","wife"],["vidua / viduus","widow / widower"],["copulati","married (joined)"],["sepultus","buried"],["obiit","died"],["patrinus / matrina","godfather / godmother"],["quondam","the late (deceased)"],["spurius, illegitimus","illegitimate"],["eodem die","on the same day"]]}},{"h":"When the year started in March"},{"p":"Until 1752, England and its colonies started the legal year on 25 March, not 1 January. A baby born in February 1731 would be born in what we'd call February 1732. Careful writers used double dates: **10 February 1731/2**."},{"p":"In 1752 Britain also switched from the Julian to the Gregorian calendar, and 2 September was followed by 14 September. Catholic countries switched much earlier, mostly from 1582. If a date seems to be eleven days off, this is usually why."},{"quiz":{"q":"A register says a child was baptised on 3 March 1720, and its parents married on 20 May 1720. Is something wrong?","o":["Yes: the child was born before the marriage","Not necessarily: 3 March 1720 came after 20 May 1720 in the old calendar","Yes: one of the dates must be a transcription error"],"a":1,"why":"Under the old style, 1720 began on 25 March, so March 1–24 were the last days of the year. 3 March 1720 is 3 March 1721 in modern terms, about nine months after the wedding."}},{"call":"tip","t":"Bishop's transcripts","p":"In England, parishes sent a yearly copy of their register to the bishop. When a register is damaged or missing, these copies can fill the gap, and they sometimes differ from the original in useful ways."}],"takeaways":["Baptism isn't birth, and marriage records before civil registration rarely name parents.","About forty Latin words will carry you through most Catholic registers.","Before 1752 in Britain, January to March dates belong to the previous year."],"lib":["Latin Genealogical Word List","Calendar changes (Julian/Gregorian) explained","FreeREG","Matricula","Archion","NLI Catholic Parish Registers","German parish records essentials (Legacy Tree)"]},{"id":"migrants","level":2,"title":"Following migrants","dek":"To cross an ocean in your research, you need the name of a town, not a country. Work backwards to find it.","min":9,"blocks":[{"p":"Finding that an ancestor came “from Hungary” or “from Ireland” is not enough to cross the ocean. Records abroad are kept by parish, district or town. The single most important goal in immigrant research is the name of the **place of origin**, and you almost always find it in records created *after* they arrived."},{"h":"Work backwards from the new country"},{"order":{"prompt":"Put these searches in the order you'd usually do them, starting with the most recent. Tap them in turn.","items":["Death record and obituary in the new country","Census entries showing year of immigration","Naturalization papers, which may name the town and ship","Passenger list for the arrival","Church or civil records in the town of origin"],"why":"Later records are easier to find and often state the earlier facts you need. Naturalization papers after 1906 in the US usually give the exact town and ship, which leads to the passenger list, which leads home."}},{"h":"Passenger lists"},{"p":"US arrival lists exist from 1820, and from the 1890s they ask far more: last residence, the nearest relative left behind, and who the passenger was joining. Departure lists survive from some ports too. Hamburg's, from 1850 to 1934, are a major source for Central and Eastern Europeans. Most of Bremen's were destroyed."},{"call":"watch","t":"Names weren't changed at Ellis Island","p":"Passenger lists were drawn up by the shipping company at the port of departure, and inspectors checked passengers against them. Names were changed later, usually by the immigrants themselves or their children, often at naturalization. Search for the original spelling."},{"h":"Place names move too"},{"p":"Borders have shifted many times. A town recorded as being in Hungary in 1900 may be in Slovakia, Romania or Serbia today, under a different name. Gazetteers, place dictionaries from the time, tell you which parish and civil district a village belonged to."},{"quiz":{"q":"József Varga's 1938 death certificate in Ohio says he was born in “Hungary.” What's your best next step?","o":["Search Hungarian church records for every József Varga born around 1870","Look for his US naturalization papers and his arrival record","Assume he was from Budapest"],"a":1,"why":"Varga is one of the most common Hungarian surnames. Without a town, searching Hungary is hopeless. Naturalization and passenger records are where the town usually appears."}}],"takeaways":["Your goal is the town of origin. Look for it in the new country first.","Work backwards: death, census, naturalization, passenger list, then home.","Check old gazetteers: borders and place names change."],"lib":["Ellis Island passenger search","Steve Morse One-Step tools","Hamburg passenger lists research","Germans to America (FamilySearch Wiki)","Meyers Gazetteer","NARA: Alien files (A-files)","USCIS Genealogy Program","CEMLA (Argentine immigration)"]},{"id":"property","level":2,"title":"Wills, land and the courts","dek":"Property left paper trails. Wills and deeds often state relationships outright, which no census does.","min":9,"blocks":[{"p":"If an ancestor owned anything, even a little, it may have left a record when it changed hands. Wills, probate inventories, deeds and court cases are among the few records that state family relationships in so many words, often generations before civil registration."},{"h":"Reading a will for clues"},{"p":"Wills follow a formula, so the interesting part is what changes: who's named, how they're described, and who's left out. Tap the highlighted phrases in this invented will."},{"clues":{"title":"Will of Samuel Pell of Wigan, yeoman (example)","text":"In the name of God Amen. I [[Samuel Pell of Wigan in the County of Lancaster, yeoman|A place and status. ‘Yeoman’ means a farmer who owned or held land on a long lease: look for deeds and tax records.]], being weak in body but of sound mind, do make this my last will. I give unto [[my loving wife Martha|Martha was alive when the will was written. Compare the will date and probate date to bracket Samuel's death.]] the use of my dwelling house for the term of her natural life. I give unto [[my son William|A son named outright. This is direct evidence of the relationship.]] my loom and all my tools. I give unto [[my daughter Sarah, now the wife of Peter Lowe|Sarah's married name and her husband, in one phrase. Search for the Lowe–Pell marriage.]] the sum of five pounds. I give unto [[my grandson Samuel, son of my late son John|John died before his father, and had a son named after his grandfather. A whole branch you may not have known about.]] the sum of two pounds. I appoint [[my trusty friend Thomas Crook|Executors and witnesses are often relatives or close neighbours. Ann Crook married William Pell in 1868: is Thomas her father?]] sole executor."}},{"call":"watch","t":"Words that meant something else","p":"Relationship words have shifted. **Son-in-law** could mean a stepson. **Cousin** could mean a niece, nephew or almost any relative. **Junior** and **Senior** could just mean the younger and older of two men with the same name in town, not father and son. **Now wife** can hint that there was an earlier one."},{"h":"Land and deeds"},{"p":"Deeds record who sold land to whom, and when heirs sold inherited land they often all signed together, naming spouses. In the US, early federal land sales are searchable at the Bureau of Land Management, and county deed books are mostly on FamilySearch. FamilySearch's full-text search now lets you search the handwriting of millions of deeds and wills by name."},{"h":"Courts"},{"p":"Court records capture families at their most dramatic: debts, disputes over inheritances, guardianships of orphans, crimes. A guardianship case can name all the children of a man who died young. Criminal records, like those of the Old Bailey in London, can describe an ancestor's appearance and words in astonishing detail."},{"quiz":{"q":"A will was written in March 1879 and proved in court in January 1880. What does that tell you about the testator's death?","o":["He died in March 1879","He died between March 1879 and January 1880","He died in January 1880"],"a":1,"why":"He was alive when he signed the will, and dead by the time it was proved. That brackets the death, so you know which burial registers to search."}}],"takeaways":["Wills and deeds often state relationships outright.","Read the formula for what changes: who's named, who's left out, and how.","Old relationship words don't always mean what they mean today."],"lib":["FamilySearch Full-Text Search","BLM General Land Office Records","Online U.S. land records (FamilySearch)","The National Archives (UK) Discovery","Old Bailey Online","PRONI","Griffith’s Valuation (Ask About Ireland)"]},{"id":"evidence","level":3,"title":"Sources, information and evidence","dek":"Not all records are equal. Professionals judge each one in three ways before deciding what it proves.","min":10,"blocks":[{"p":"Beginners ask “Is this record right?” Experienced researchers ask three smaller questions instead: what kind of **source** is it, where did its **information** come from, and what **evidence** does it give for the question I'm asking? This vocabulary comes from Elizabeth Shown Mills and the Board for Certification of Genealogists, and it's used across the field."},{"h":"1. The source: original or derivative?"},{"p":"An **original** source is the first recording of an event, like the register a vicar wrote in. A **derivative** is copied, transcribed, indexed or abstracted from something else, like a website index or a typed transcript. Each copy is a chance for error. An **authored work**, like a published family history, is someone's conclusions drawn from many sources."},{"h":"2. The information: primary or secondary?"},{"p":"Information is judged piece by piece. **Primary** information comes from someone who witnessed the event: a mother giving her baby's birth date. **Secondary** information is secondhand: a son giving his late father's birthplace on a death certificate. One record usually holds both."},{"h":"3. The evidence: direct, indirect or negative?"},{"p":"Evidence only exists in relation to a question. **Direct** evidence answers it on its own: “William, son of Samuel Pell.” **Indirect** evidence has to be combined with other facts to answer it, like an age that points to a birth year. **Negative** evidence is the meaningful absence of something you'd expect to find, like a man missing from a tax list the year after he's said to have died."},{"sort":{"prompt":"For a death certificate from 1938, classify each piece of information.","cats":["Primary","Secondary"],"items":[["The date of death, given by the attending doctor",0,"Primary: the doctor was present at or near the time."],["The deceased's birthplace, given by his son",1,"Secondary: the son wasn't there when his father was born."],["The cause of death",0,"Primary: the doctor's own observation."],["The names of the deceased's parents",1,"Secondary: the informant is reporting what he was told, often decades earlier."],["The place of burial, given by the undertaker",0,"Primary: the undertaker arranged it."]]}},{"call":"tip","t":"Why a death certificate gets birth dates wrong","p":"A death certificate is an excellent source for the death and a weak one for the birth. The informant was grieving, often guessing, and had never seen the birth. Look for a record made at the time instead."},{"quiz":{"q":"An online index says Edith Ashworth was born on 12 May 1897. What kind of source is the index?","o":["Original","Derivative","Authored work"],"a":1,"why":"An index is derived from another record. Find the image of the original register or certificate it was made from."}}],"takeaways":["Ask three questions: what source, whose information, what evidence.","Prefer originals over copies, and primary information over secondhand.","Evidence only exists relative to a question."],"lib":["Evidence Explained","Genealogical Proof Standard (overview)","Negative search results vs. negative evidence","Genealogy Standards (BCG manual)","Board for Certification of Genealogists"]},{"id":"cite","level":3,"title":"Cite as you go","dek":"A citation is a note to your future self: where this came from, and how to find it again.","min":7,"blocks":[{"p":"Six months from now you won't remember which census told you Hannah was born in Bury, or whether you saw the image or just an index. A citation answers that in a line. It also lets anyone else check your work, which is what makes a family history trustworthy."},{"h":"Five questions every citation answers"},{"p":"Formats vary, and *Evidence Explained* by Elizabeth Shown Mills is the standard guide for genealogy. But almost every good citation answers the same five questions:"},{"list":["**Who** created the record? (Name the person or office.)","**What** is it? (The title or a description.)","**When** was it made? (And when the event happened, if different.)","**Where in** the source is the item? (Page, entry, folio, image number.)","**Where is** the source? (The archive, or the website and collection, with the date you looked.)"]},{"tool":"cite"},{"call":"tip","t":"Cite what you actually saw","p":"If you saw an index on a website, cite the index on that website, not the original register it was made from. If you later view the register, cite that too. Your citation should never claim more than you looked at."},{"quiz":{"q":"You found a baptism in a FreeREG transcription. Which is the honest citation?","o":["The parish register of St Peter, Bolton, entry for 4 May 1814","FreeREG transcription of the St Peter, Bolton baptisms, entry for 4 May 1814, viewed 26 October 2026","FreeREG"],"a":1,"why":"You saw a transcription, so cite the transcription, with enough detail to find the entry again. Then order or view the original register and cite that separately."}}],"takeaways":["Cite every fact the moment you record it.","Answer who, what, when, where in, and where is.","Cite what you actually saw, not the original behind it."],"lib":["Evidence Explained","Citation tips at Cyndi’s List","Genealogy Standards (BCG manual)","Evidentia"]},{"id":"conflict","level":3,"title":"When records disagree","dek":"Conflicting records are not a dead end. Weighing them carefully is how real conclusions are made.","min":10,"blocks":[{"p":"Sooner or later two records will disagree. A birth year differs by four years, a surname appears two ways, a birthplace changes county. Beginners pick the one they like. Researchers line everything up and weigh it."},{"h":"A real problem from the example tree"},{"p":"In the example family, Ann, wife of William Pell, appears as **Ann Crook** on her marriage and **Ann Cook** on one child's birth certificate. Which is right? Gather every record, and judge each one."},{"table":{"head":["Record","Name given","Who gave it","Weight"],"rows":[["1868 marriage register, Wigan","Ann Crook","Ann herself, signed","Strong: original, primary, she signed"],["1871 birth certificate of Eliza","Ann Pell, formerly Cook","William, the father","Moderate: original, but given by her husband"],["1848 baptism, Wigan","Ann, daughter of Thomas and Jane Crook","Clergyman, at the time","Strong, if it's the same Ann"],["1921 death index","Ann Pell","Index","Silent on maiden name"]]}},{"p":"The marriage is an original record with primary information, and she signed it. The birth certificate was given by her husband and could easily have misheard “Crook” or been miswritten by the registrar. A baptism for an Ann Crook with a father named Thomas fits too, and Thomas Crook appears as executor of the Pell will in Lesson 8. The weight of evidence points to **Crook**."},{"call":"tip","t":"Write the resolution down","p":"Whatever you decide, record why in the person's notes: which records conflict, which you trust more, and why. A future researcher, maybe you, will have the same doubt."},{"h":"Timelines catch impossible people"},{"p":"One of the best tools for finding errors is a simple timeline. Put every event for a person in order with their age at each. Problems leap out: a mother aged 9 at a birth, a child born after a father's burial, a man in two places on census night."},{"quiz":{"q":"A tree shows Hannah Kay, born 1814, as the mother of a child born in 1866. What's the most likely explanation?","o":["Late motherhood: it happens","The child probably belongs to a different Hannah, or a daughter of Hannah","Her birth year is certainly wrong"],"a":1,"why":"She'd have been 52. Not quite impossible, but very rare. Far more likely is a merged identity, or a grandchild entered as a child. Check the baptism or birth record of the child for the mother's name."}},{"quiz":{"q":"Which conflict should usually be resolved in favour of the earlier record?","o":["An age at marriage versus an age at death","A middle name given at baptism versus one given in a newspaper notice 70 years later","Both of these"],"a":2,"why":"Records made closer to the event, by people closer to it, tend to be more reliable. This is a rule of thumb, not a law: an earlier derivative copy can still be worse than a later original."}}],"takeaways":["Gather every record before deciding anything.","Weigh each one: original or copy, firsthand or secondhand, made when and by whom.","Write your reasoning down, and use timelines to catch impossible people."],"lib":["Making a genealogy timeline","Evidentia","Mastering Genealogical Proof study groups (GenProof)","Genealogical Proof Standard (overview)","Legacy Tree Genealogists blog"]},{"id":"plan","level":3,"title":"Plans and logs","dek":"Researchers who plan find more in less time, and never search the same register twice.","min":8,"blocks":[{"p":"It's easy to spend an evening clicking from site to site, finding interesting things and remembering none of them. A research plan turns that into a focused search, and a research log means you never repeat it."},{"h":"A plan in five parts"},{"list":["**Objective.** One specific question: “Who were the parents of Ann Crook, who married William Pell in Wigan in 1868?” Not “find out about the Crooks.”","**Known facts.** Everything you've proven so far, with sources.","**Working hypothesis.** Your best guess, stated so it can be tested: “Ann was the daughter of Thomas and Jane Crook of Wigan.”","**Sources to search.** A list of the specific records that could confirm or disprove it, best first.","**Results.** What each search found, including what it didn't."]},{"h":"Log what you didn't find"},{"p":"A research log lists every search: the date, the source, what you searched for, and the result. “Searched Wigan baptisms 1844–1852 for Ann Crook: none found” is valuable. It stops you searching again, and the absence itself can become evidence."},{"h":"Make a plan for someone in your tree"},{"p":"Pick a person and this builds a starting plan from what's already in your tree. Add it to their notes, then refine it."},{"tool":"plan"},{"call":"pro","t":"Plan for one question at a time","p":"The narrower the objective, the better the plan. Once it's answered, write a new one. Professionals often run several small plans for one ancestor, one after another."}],"takeaways":["Ask one specific question at a time.","State a hypothesis you can test, and list sources to test it.","Log every search, including those that found nothing."],"lib":["Research logs (NYG&B)","Family Locket: Research Like a Pro","Research Like a Pro podcast","FamilySearch Research Wiki","Amy Johnson Crow"]},{"id":"fan","level":4,"title":"The FAN club","dek":"When one person's records run out, research the people around them. Their records often hold the answer.","min":9,"blocks":[{"p":"People didn't live alone. They moved with neighbours, married friends' sisters, chose relatives as godparents and asked cousins to witness their wills. Elizabeth Shown Mills named this the **FAN club**: Friends, Associates and Neighbours. When your ancestor's own records go silent, theirs may not."},{"h":"Who's in the cluster"},{"list":["**Witnesses** at weddings and on wills and deeds","**Godparents** and sponsors at baptisms","**Neighbours** on the census page and tax lists","**Executors, sureties and bondsmen**","People who **migrated together**, or arrived on the same ship","Members of the same church, lodge or regiment"]},{"h":"Spotting the cluster"},{"p":"Tap the names in this invented marriage entry that you'd add to your cluster research."},{"clues":{"title":"Marriage, St Catharine's, Wigan, 1868 (example)","text":"No. 214. [[William Pell|The groom, the person you're researching.]], 23, bachelor, weaver, of [[Scholes|A district of Wigan. Note it for the census and directories.]], father [[Samuel Pell, weaver|Matches the will in Lesson 8.]]. Ann Crook, 20, spinster, of [[Scholes|Same district as the groom. Neighbours marrying neighbours: search the 1861 census of Scholes for both families.]], father [[Thomas Crook, collier|Her father's name and trade. Look for his death, his will, and a Thomas Crook in Wigan baptisms around 1820.]]. Married after banns. Witnesses: [[Peter Lowe|Peter Lowe married William's sister Sarah: a family witness.]] and [[Jane Crook|Possibly Ann's mother or sister. Witnesses were very often relatives.]]."}},{"h":"How to work a cluster"},{"p":"Make a list of names that appear repeatedly around your ancestor. Then research each of them with the same care as a direct ancestor: where did *they* come from? If six families arrive in a town in the same year from the same place, and you can find where five came from, the sixth very likely came from there too."},{"quiz":{"q":"Your ancestor appears from nowhere in an 1830s tax list. Which is the most promising next step?","o":["Search the whole country for men of the same name","Note the names listed next to him and trace where those neighbours came from","Wait for a DNA match"],"a":1,"why":"Tax lists were often compiled in the order the assessor walked. Neighbours who arrived at the same time often came from the same place."}}],"takeaways":["Research the people around your ancestor, not just your ancestor.","Witnesses, godparents and neighbours were often relatives.","Migrations happened in groups: trace the group."],"lib":["FAN club / cluster research (overview)","Rootdig (Michael John Neill)","Researching tax lists as census substitutes","Census ED finder (One-Step)","Sanborn Fire Insurance Maps (LOC)"]},{"id":"walls","level":4,"title":"Brick walls and hidden records","dek":"Most brick walls are not missing records. They're records nobody has looked in yet, or assumptions nobody has checked.","min":10,"blocks":[{"p":"A “brick wall” is the point where an ancestor's trail seems to stop. They feel permanent, but most fall to one of two things: searching records that aren't indexed online, or questioning something you assumed early on."},{"h":"Audit your assumptions"},{"p":"Go back over what you think you know, and ask where each fact came from. Tick each statement you can back with an original record."},{"check":{"prompt":"Brick wall audit","items":["I know their name from a record made during their life, not a descendant's memory","Their age comes from more than one record","I've confirmed the place name, and which parish or county it belonged to at the time","I've checked whether county or parish boundaries changed","I've searched for every spelling variant and nickname","I've looked for siblings, not just the direct ancestor","I've looked at the original images, not only the index","I've researched their witnesses, neighbours and godparents"]}},{"h":"Find what isn't indexed"},{"p":"Huge numbers of records are online as images only. The **FamilySearch Catalog** is the way in: search it by place, not by name, and work through every heading for the town and county. Tax records, court minutes, poor law papers and land books are listed there and searched almost by no one."},{"list":["**ArchiveGrid**, **Archives Hub** and The National Archives' **Discovery** list collections held in local archives that have never been filmed.","**FamilySearch Full-Text Search** reads handwriting with AI. It finds names inside deeds and wills that were never indexed.","**Local histories and newspapers** mention people who appear in no official record."]},{"h":"Boundaries move"},{"p":"In the US especially, counties split and new ones formed constantly. A family that never moved may appear in three counties' records over 40 years. Check the county's formation date before deciding records don't exist."},{"h":"Finding women"},{"p":"Women are the most common brick walls, because they change surnames and appear less in property and court records. Work through their children's records (a birth certificate gives the mother's maiden name), their husband's will, their own death, and the witnesses at their marriage."},{"quiz":{"q":"You've searched every index for a family's baptisms in a parish and found nothing. What should you check next?","o":["Whether the register's images exist in the FamilySearch Catalog under that parish","Whether the family moved to another country","Nothing: the baptisms weren't recorded"],"a":0,"why":"Indexes cover only some registers, and some years. The images may be there to browse, page by page."}}],"takeaways":["Audit your assumptions before searching further.","Search catalogs by place to find unindexed records.","Check boundaries, and follow women through their children and husbands."],"lib":["FamilySearch Catalog","FamilySearch Full-Text Search","ArchiveGrid","Atlas of Historical County Boundaries","Tips for finding female ancestors","Researching poor ancestors","Archives Hub"]},{"id":"hands","level":4,"title":"Old handwriting and languages","dek":"Old documents aren't unreadable, just unfamiliar. Learn a dozen letterforms and you can read most of them.","min":9,"blocks":[{"p":"The first time you open a register from the 1700s it can look like a foreign script. It isn't. Writers used a handful of letter shapes and abbreviations we've since dropped. Learn those, and read slowly, and most pages open up."},{"h":"The long s"},{"p":"Until about 1800, a lower-case s at the start or in the middle of a word was usually written **ſ**, the long s. It looks like an f without the full crossbar. A double s was often written ſs or ſſ."},{"quiz":{"q":"What does this say?","fell":"Bleſsed are the meek","o":["Blefsed are the meek","Blessed are the meek","Bleffed are the meek"],"a":1,"why":"The first s is a long s, the second a short one. Seventeenth- and eighteenth-century printers used the same convention."}},{"quiz":{"q":"And this?","fell":"Elizabeth Haſlam, ſpinſter","o":["Elizabeth Haslam, spinster","Elizabeth Haflam, fpinfter","Elizabeth Hallam, spinster"],"a":0,"why":"Three long s's. Once you see them, you can't miss them."}},{"h":"Other letters that trip people up"},{"list":["**u and v** were interchangeable: ‘vnto’ is ‘unto’, ‘haue’ is ‘have’.","**i and j** were interchangeable: ‘Iohn’ is ‘John’.","**ff** at the start of a name is a capital F: ‘ffrancis’ is ‘Francis’.","**y** often stood for an old letter, thorn, meaning ‘th’: ‘ye’ is ‘the’, ‘yt’ is ‘that’.","Abbreviations were marked with a line above or a raised letter: ‘wm’ is William, ‘Jno’ is John, ‘Chas’ is Charles."]},{"call":"tip","t":"Build an alphabet from the page","p":"When you can't read a word, find letters you're sure of elsewhere on the same page: in the names you know, the place name, the year. Copy each letterform out. The same hand writes every letter the same way."},{"h":"Common abbreviations in registers"},{"flip":{"cards":[["Wm","William"],["Jno","John"],["Jas","James"],["Thos","Thomas"],["Chas","Charles"],["Saml","Samuel"],["bapt.","baptised"],["bur.","buried"],["wid.","widow or widower"],["inst.","this month (instant)"],["ult.","last month (ultimo)"],["s. & h.","son and heir"]]}},{"h":"Other languages"},{"p":"If your family came from Germany, look up the **Kurrent** script before anything else: German records were written in it until the 1940s, and several letters look nothing like their modern forms. FamilySearch publishes word lists for dozens of languages with just the vocabulary genealogists need."}],"takeaways":["Learn the long s, u/v, i/j, ff and y for th.","Build an alphabet from the same hand on the same page.","Word lists for each language cover the few hundred words you need."],"lib":["BYU Script Tutorial","The National Archives (UK): Palaeography tutorial","ScotlandsPeople: Scottish handwriting","Reading old German script (FamilySearch)","Latin Genealogical Word List","German Genealogical Word List","Handwriting guides at Cyndi’s List"]},{"id":"dna","level":4,"title":"DNA as evidence","dek":"A DNA test doesn't hand you a family tree. It gives you evidence, and like any evidence it has to be weighed with records.","min":11,"blocks":[{"p":"DNA testing has opened walls that records never could: unknown fathers, adoptions, families separated by slavery or war. But a list of matches isn't a tree. DNA tells you *that* you're related to someone and roughly *how closely*. Records tell you *how*."},{"h":"Three kinds of test"},{"table":{"head":["Test","Follows","Best for"],"rows":[["Autosomal","All your lines, roughly back five or six generations","Finding cousins on every side; the test most companies sell"],["Y-DNA","Father to son only, the direct paternal line","Surname studies and one paternal line, very far back. Only men carry it."],["Mitochondrial (mtDNA)","Mother to child, the direct maternal line","One maternal line, very far back, usually too far for records"]]}},{"quiz":{"q":"You want to know whether two Ashworth men in different countries descend from the same Ashworth father in the 1700s. Which test fits best?","o":["Autosomal","Y-DNA","mtDNA"],"a":1,"why":"Y-DNA passes almost unchanged from father to son, as surnames usually do. Comparing two direct-line male Ashworths can show a shared paternal ancestor many generations back."}},{"h":"Centimorgans: how much you share"},{"p":"Testing companies tell you how much DNA you share with a match, measured in **centimorgans** (cM). More shared DNA means a closer relationship, but every relationship has a wide range, and the ranges overlap. Try a number from a real match."},{"tool":"cm"},{"h":"From matches to ancestors"},{"list":["**Start with matches who have trees**, and look for surnames and places you recognise.","**Group your matches.** The Leeds Method sorts your closer cousin matches into clusters, which usually line up with your four grandparents.","**Use shared matches.** If two matches share DNA with you and with each other, they probably connect through the same line.","**Build trees for matches who haven't.** It's slow, and it's how most unknown-parentage cases are solved."]},{"call":"watch","t":"Be ready for surprises","p":"DNA can reveal unknown siblings, adoptions and different biological fathers, for you or for others. Think about what you'll do if that happens before you test, and handle what you find about living people with great care."}],"takeaways":["DNA shows that you're related, and roughly how closely. Records show how.","Choose the test for the question: autosomal, Y-DNA or mtDNA.","Shared cM ranges overlap. Use them with trees and records, never alone."],"lib":["ISOGG Wiki","Shared cM Project tool","DNA Painter","Leeds Method (Dana Leeds)","The Genetic Genealogist (Blaine Bettinger)","Y-DNA projects explained (DNAeXplained)","Legal Genealogist: DNA and law"]},{"id":"prove","level":4,"title":"Proving it, and passing it on","dek":"The final skill: a conclusion others can trust, written down so it outlives you.","min":9,"blocks":[{"p":"Everything in this course leads here. A conclusion is only as good as the reasoning behind it, and only useful if someone else can follow it. Professional genealogists measure their conclusions against one standard."},{"h":"The Genealogical Proof Standard"},{"p":"The Board for Certification of Genealogists sets out five elements. A conclusion that meets all five can be called proved, though new evidence can always reopen it."},{"order":{"prompt":"Put the five elements in their usual order. Tap them in turn.","items":["Reasonably exhaustive research","Complete and accurate source citations","Thorough analysis and correlation of the evidence","Resolution of any conflicting evidence","A soundly reasoned, coherently written conclusion"],"why":"Search widely, cite everything, analyse and correlate it, resolve the conflicts, then write it down. Each element depends on the ones before."}},{"h":"Writing it up"},{"p":"Not every fact needs an essay. When records state something plainly and agree, a citation is enough. When you've combined indirect evidence or resolved a conflict, write a short **proof summary**: what the question was, which records you used, how they fit together, and why the conflicts don't change the answer. The notes field on each person in this app is a good place for it."},{"h":"Tell their stories"},{"p":"Names and dates are the skeleton. Social history is the flesh: what a cotton spinner's day was like in 1870s Bolton, what a crossing from Hamburg cost, what the 1918 flu did to a town. Put your ancestors' lives in their world, and the people you've found will make sense to the family who read about them."},{"h":"Protect the living, preserve the dead"},{"list":["Don't publish details of living people without their permission.","Keep copies of your research in more than one place, in formats that will still open in thirty years.","Scan photographs and documents at high resolution, and write down who and what they show.","Share with relatives, and with archives and societies who'll keep it after you."]},{"quiz":{"q":"You've concluded that Ann Crook was the daughter of Thomas Crook, using a baptism, a marriage, a will and a census. What's left to do to meet the standard?","o":["Nothing: four records are enough","Check you've searched every reasonable source, cite each record, and write down how they fit together and why the ‘Cook’ spelling doesn't change the answer","Find a fifth record"],"a":1,"why":"The standard isn't a number of records. It's whether your search was reasonably exhaustive, your sources are cited, and your reasoning is written down where someone else can follow it."}}],"takeaways":["Measure conclusions against the five elements of the Genealogical Proof Standard.","Write a proof summary whenever you combine evidence or resolve a conflict.","Put ancestors in their world, protect the living, and preserve your work."],"lib":["Genealogical Proof Standard (overview)","Genealogy Standards (BCG manual)","Putting ancestors’ lives in context","Using social history in genealogy","Library of Congress: Personal digital archiving","WikiTree","Board for Certification of Genealogists"]}]}</script>

  if(MODE==='local'){ el.classList.remove('show'); return }

  let txt='', cls='';

  else if(n&&SYNC.failing){ txt=`Waiting to sync ${n} change${n>1?'s':''}`; cls='off' }

/* ---------- relationships ---------- */
let R=null;
function buildR(){
  const par=new Map(),kids=new Map(),sp=new Map(),uOf=new Map();
  for(const [id,p] of S.people){ par.set(id,uniq((p.parents||[]).filter(x=>x!==id&&S.people.has(x))).slice(0,2)); kids.set(id,[]); sp.set(id,[]); uOf.set(id,[]); }
  for(const [id,ps] of par) for(const p of ps) kids.get(p).push(id);
  for(const [u,x] of S.unions){ if(S.people.has(x.a)&&S.people.has(x.b)&&x.a!==x.b){ sp.get(x.a).push(x.b); sp.get(x.b).push(x.a); uOf.get(x.a).push(u); uOf.get(x.b).push(u);} }
  const by=id=>year(S.people.get(id)?.birth?.date);
  const cmp=(a,b)=>(by(a)??9999)-(by(b)??9999)||nm(S.people.get(a)).localeCompare(nm(S.people.get(b)));
  for(const k of kids.values()) k.sort(cmp);
  for(const [id,list] of uOf) list.sort((a,b)=>(dateVal(S.unions.get(a).date)??9e9)-(dateVal(S.unions.get(b).date)??9e9));
  for(const [id,list] of sp) sp.set(id, uOf.get(id).map(u=>{const x=S.unions.get(u);return x.a===id?x.b:x.a}));
  const docs=new Map();
  for(const s of S.sources.values()) for(const p of (s.people||[])) docs.set(p,(docs.get(p)||0)+1);
  R={par,kids,sp,uOf,cmp,docs};
}
const unionBetween=(a,b)=>[...S.unions.entries()].find(([,u])=>(u.a===a&&u.b===b)||(u.a===b&&u.b===a))?.[0];

/* ---------- facts (timeline points) ---------- */
// keys: "<pid>|birth", "<pid>|death", "<pid>|e|<eid>", "u|<uid>"
function factData(key){
  const [a,b,c]=key.split('|');
  if(a==='u'){const u=S.unions.get(b); return u?{type:'union',uid:b,data:u}:null}
  const p=S.people.get(a); if(!p) return null;
  if(b==='birth'||b==='death') return {type:b,pid:a,data:p[b]||{}};
  if(b==='e'){const e=(p.events||[]).find(x=>x.id===c); return e?{type:'event',pid:a,eid:c,data:e}:null}

}
function factTitle(key,viewer){

    const verb=u.status==='partners'?'Partnered with':'Married';
    if(other) return `${verb} ${short(S.people.get(other))}${u.status==='divorced'?' (divorced)':''}`;
    return `${u.status==='partners'?'Partnership':'Marriage'} · ${short(S.people.get(u.a))} & ${short(S.people.get(u.b))}`;
  }
  const label=f.type==='birth'?'Birth':f.type==='death'?'Death':(f.data.type||'Event');

  const p=S.people.get(pid); if(!p) return [];
  const k=[`${pid}|birth`]; for(const e of (p.events||[])) k.push(`${pid}|e|${e.id}`);
  for(const u of (R.uOf.get(pid)||[])) k.push(`u|${u}`);
  if(p.death&&(p.death.date||p.death.place||p.death.hunt)) k.push(`${pid}|death`);

function timeline(pid){
  const p=S.people.get(pid); const items=[];
  const add=(key,rel)=>{const f=factData(key); if(f) items.push({key,rel,f,v:dateVal(f.data.date)})};
  add(`${pid}|birth`,'self');
  for(const e of (p.events||[])) add(`${pid}|e|${e.id}`,'self');
  for(const u of R.uOf.get(pid)) add(`u|${u}`,'self');

  if(hasDeath) add(`${pid}|death`,'self');

  const fc=kind==='grow'?null:vp.querySelector(`.card[data-id="${CSS.escape((state.open||[])[k]||'')}"]:not(.addn)`);

  const anim=(el,kf,opt)=>{ const a=el.animate(out?[...kf].reverse():kf,{fill:out?'forwards':'backwards',...opt}); treeAnims.push(a); return a };
  // each connector grows segment by segment from the selected person's end, rootlets sprouting as it passes
  const draw=(el,delay,dur,easing)=>{ let len=0; try{ len=el.getTotalLength() }catch{} if(!len) return;
    el.style.strokeDasharray=`${len} ${len}`;
    anim(el,[{strokeDashoffset:len},{strokeDashoffset:0}],{duration:dur,delay,easing}).finished.then(()=>{ if(!out) el.style.strokeDasharray='' }).catch(()=>{}) };
  for(const g of lines){
    const r=rel(g), d=r<=0?-r:r-1, base0=order(d)*step, span=step*1.02;
    const segs=[...g.querySelectorAll('.seg')], n=segs.length;
    segs.forEach((el,i)=>{ const q=out?n-1-i:i; draw(el,base0+q*span/n,span/n+8,'linear') });
    g.querySelectorAll('.hair').forEach(h=>{ const t=+h.dataset.t; draw(h,base0+(out?(1-t):t)*span+30,140,ease) });
  }
  for(const el of cards){ const lv=L(el), c=el.querySelector('.ci'); if(!c||(keep&&el.dataset.id===keep&&!el.classList.contains('addn'))) continue;
    anim(c,[{opacity:0,transform:'scale(.5)'},{opacity:1,transform:'scale(1.06)',offset:.7},{opacity:1,transform:'scale(1)'}],{duration:step*1.3,delay:Math.max(0,order(lv)*step-(out?0:step*.2)),easing:springy}) }
  for(const el of mars){ anim(el,[{opacity:0},{opacity:.7}],{duration:step,delay:order(L(el))*step+step*.4,easing:ease}) }

}

/* ---------- circle view ---------- */
function circleSVG(me){
  const seen=new Set([me]); const take=a=>a.filter(x=>x!=null&&!seen.has(x)&&(seen.add(x),true));
  const sexR=id=>({M:0,F:1})[S.people.get(id)?.sex]??2;
  const parents=take([...R.par.get(me)].sort((a,b)=>sexR(a)-sexR(b)));
  const spouses=take(R.sp.get(me));
  const kids=take(R.kids.get(me));
  const sibs=take(uniq(R.par.get(me).flatMap(p=>R.kids.get(p))));
  const sides=parents.map(p=>{const gps=take(R.par.get(p)); const aunts=take(uniq(R.par.get(p).flatMap(g=>R.kids.get(g)))); return {p,gps,aunts:aunts.map(a=>({a,c:take(R.kids.get(a))}))}});
  const kidG=kids.map(k=>({a:k,c:take(R.kids.get(k))}));
  const sibG=sibs.map(s=>({a:s,c:take(R.kids.get(s))}));
  const leaves=g=>g.reduce((n,x)=>n+Math.max(1,x.c.length),0);
  const RAD=[0,135,245,345,440];
  // degrees one person needs on each ring (node plus label), at base radii
  const ND=[0,108,84,64,54].map((px,i)=>i?px/RAD[i]*180/Math.PI:0);
  const secs=[];
  if(kidG.length) secs.push({t:'ch',w:Math.max(kidG.length*ND[1],leaves(kidG)*ND[2])});
  if(sibG.length) secs.push({t:'sib',w:Math.max(sibG.length*ND[1],leaves(sibG)*ND[2])});
  sides.forEach((s,i)=>secs.push({t:i?'b':'a',side:s,w:Math.max(ND[1],s.gps.length*ND[2]*2,s.aunts.length*ND[3],leaves(s.aunts)*ND[4])}));
  if(spouses.length) secs.push({t:'sp',w:spouses.length*ND[1]});
  const nodes=[], links=[];
  const node=(id,ring,a,k)=>{nodes.push({id,ring,a,k}); return {id,ring,a}};
  let scale=1;
  if(secs.length){
    const PADD=secs.length>1?7:0, avail=360-PADD*2*secs.length, need=secs.reduce((n,s)=>n+s.w,0);
    scale=Math.max(1,need/avail); const f=avail/need;
    let cur=0; secs.forEach(s=>{s.a0=cur+PADD; s.a1=cur+PADD+s.w*f; cur=s.a1+PADD});
    const ai=secs.findIndex(s=>s.t==='a'), bi=secs.findIndex(s=>s.t==='b');
    let rot;
    if(ai>=0&&bi>=0) rot=-90-(secs[ai].a1+secs[bi].a0)/2;
    else if(ai>=0) rot=-90-(secs[ai].a0+secs[ai].a1)/2;
    else rot=90-(secs[0].a0+secs[0].a1)/2;
    secs.forEach(s=>{s.a0+=rot;s.a1+=rot});
    const even=(arr,a0,a1)=>arr.map((x,i)=>a0+(i+.5)*(a1-a0)/arr.length);
    const hier=(grp,a0,a1,r1,r2,k,from)=>{
      const tw=leaves(grp)||1; let c=a0;
      grp.forEach(g=>{const w=Math.max(1,g.c.length)*(a1-a0)/tw; const n=node(g.a,r1,c+w/2,k); if(from) links.push([from(g.a)||from(null),n]);
        even(g.c,c,c+w).forEach((ang,i)=>links.push([n,node(g.c[i],r2,ang,k)])); c+=w});
    };
    const meN={id:me,ring:0,a:0};
    for(const s of secs){
      if(s.t==='sp') even(spouses,s.a0,s.a1).forEach((a,i)=>links.push([meN,node(spouses[i],1,a,'sp')]));
      if(s.t==='ch') hier(kidG,s.a0,s.a1,1,2,'ch',()=>meN);
      if(s.t==='sib') hier(sibG,s.a0,s.a1,1,2,'sib',()=>meN);
      if(s.t==='a'||s.t==='b'){
        const {p,gps,aunts}=s.side, mid=(s.a0+s.a1)/2, sp=(s.a1-s.a0);
        const pn=node(p,1,mid,s.t); links.push([meN,pn]);
        const gn=even(gps,mid-sp/4,mid+sp/4).map((a,i)=>{const n=node(gps[i],2,a,s.t); links.push([pn,n]); return n});
        hier(aunts,s.a0,s.a1,3,4,s.t,(aid)=>{ if(!aid) return gn[0]; const ps=R.par.get(aid); return gn.find(g=>ps.includes(g.id))||gn[0] });
      }
    }
  }
  for(let i=1;i<RAD.length;i++) RAD[i]*=scale;
  const pol=(r,a)=>[500+r*Math.cos(a*Math.PI/180),500+r*Math.sin(a*Math.PI/180)];
  const maxRing=Math.max(1,...nodes.map(n=>n.ring)); const ext=RAD[maxRing]+70;
  const NR=[52,30,24,20,17];
  let g='';
  for(let r=1;r<=maxRing;r++) g+=`<circle class="ring" cx="500" cy="500" r="${RAD[r]}"/>`;
  for(const [A,B] of links){ if(!A||!B) continue;
    const [x1,y1]=pol(RAD[A.ring],A.a),[x2,y2]=pol(RAD[B.ring],B.a);
    if(A.ring===0){ g+=`<path class="cl" d="M500 500L${x2} ${y2}"/>`; continue }
    const rm=(RAD[A.ring]+RAD[B.ring])/2, [mx1,my1]=pol(rm,A.a), [mx2,my2]=pol(rm,B.a);
    g+=`<path class="cl" d="M${x1} ${y1}L${mx1} ${my1}A${rm} ${rm} 0 0 ${B.a>A.a?1:0} ${mx2} ${my2}L${x2} ${y2}"/>`;
  }
  const pme=S.people.get(me);
  const drawNode=(id,ring,a,k)=>{
    const p=S.people.get(id); const [x,y]=ring?pol(RAD[ring],a):[500,500]; const r=NR[ring];
    const halo=`<circle class="halo k-${k}" cx="${x}" cy="${y}" r="${r+4}"/>`;
    const label=ring>=3?esc(trunc(String(p.given||'').split(/\s+/)[0]||'?',12)):esc(trunc(short(p),18));
    return `<g class="cn" tabindex="0" role="button" data-cgo="${esc(id)}${ring?'.circle':''}" aria-label="${esc(nm(p))}"><title>${esc(nm(p))} ${esc(span(p))}</title>${halo}${avatarSVG(p,'c'+ring+id,x,y,r)}${p.marked?`<circle class="mk" cx="${x-r*.72}" cy="${y-r*.72}" r="${Math.max(5,r*.22)}"/>`:''}
      <text class="lbl${ring>=3?' sm':''}" x="${x}" y="${y+r+16}" text-anchor="middle">${label}</text>${ring===0?`<text class="lbl sm" x="${x}" y="${y+r+31}" text-anchor="middle">${esc(span(p))}</text>`:''}</g>`;
  };
  for(const n of nodes) g+=drawNode(n.id,n.ring,n.a,n.k);
  g+=drawNode(me,0,0,'me');
  return `<svg id="circle-svg" viewBox="${500-ext} ${500-ext} ${ext*2} ${ext*2}" aria-label="Family circle for ${esc(nm(pme))}">${g}</svg>`;
}

        :`<div class="lord-pool">${X.sh.filter(v=>!sq.includes(v)).map(v=>`<button class="lchip" data-act="lo" data-k="${k}" data-i="${v}">${md(o.items[v])}</button>`).join('')}</div>${sq.length?`<div style="margin-top:var(--s3)"><button class="btn sm ghost" data-act="lo-undo" data-k="${k}">Undo</button></div>`:''}`}`;

    C.text.replace(/\[\[(.+?)\|(.+?)\]\]/g,(m,ph,nt,off)=>{ parts.push(esc(C.text.slice(last,off))); const j=notes.length; notes.push([ph,nt]);

    inner=xh(b.check.prompt||'Checklist',`${on.size} of ${b.check.items.length}`)+`<div class="lchk">${b.check.items.map((t,j)=>`<button data-act="lchk" data-k="${k}" data-i="${j}" aria-pressed="${on.has(j)}"><span class="bx">${on.has(j)?LI.chk:''}</span><span class="tx">${md(t)}</span></button>`).join('')}</div>`;
  }
  else if(b.tool==='soundex') inner=sxHTML(k,X);

  return `<section class="lx" id="lx-${l.id}-${i}">${inner}</section>`;

/* Soundex: first letter, then up to three digits for the consonant sounds that follow. H and W don't separate
   letters with the same code; vowels do. */
function soundex(name){
  const s=String(name||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z]/g,''); if(!s) return null;
  const cd=c=>'BFPV'.includes(c)?'1':'CGJKQSXZ'.includes(c)?'2':'DT'.includes(c)?'3':c==='L'?'4':'MN'.includes(c)?'5':c==='R'?'6':'HW'.includes(c)?'h':'0';
  const steps=[[s[0],'',true]]; let out=s[0], prev=cd(s[0]);
  for(const c of s.slice(1)){ const d=cd(c); let kept=false;
    if(d==='0') prev='0'; else if(d!=='h'){ if(d!==prev&&out.length<4){ out+=d; kept=true } prev=d }
    steps.push([c,d==='h'||d==='0'?'':d,kept]) }
  return {code:(out+'000').slice(0,4),steps};
}
const treeSurnames=()=>[...new Set([...S.people.values()].map(p=>String(p.surname||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));

  const sur=treeSurnames(), same=sur.filter(n=>soundex(n).code===r.code&&n.toLowerCase()!==String(v).trim().toLowerCase());
  return `<div class="sx-out"><span class="sx-code">${r.code}</span><div class="sx-steps" aria-hidden="true">${r.steps.slice(0,14).map(([c,d,kp],j)=>`<span class="${kp?'k':d?'skip':''}">${c}<i>${j===0?'1st':d||'·'}</i></span>`).join('')}</div></div>
    <p style="margin:0;color:var(--muted);font-size:14px;line-height:20px">${same.length?`Sounds like ${same.map(esc).join(', ')} in your tree. Search sites that use Soundex will return them together.`:'Gold letters make the code. Vowels, H and W are skipped, and repeated sounds count once.'}</p>
    ${sur.length?`<div class="lsub">Surnames in your tree</div><div class="sx-names">${sur.slice(0,30).map(n=>`<button class="tag" data-act="lsx" data-k="" data-n="${esc(n)}" aria-pressed="${soundex(n).code===r.code}">${esc(n)}<i>${soundex(n).code}</i></button>`).join('')}</div>`:''}`;
}

/* Shared centimorgans: approximate ranges and averages after the Shared cM Project (Bettinger, v4, 2020). */
const CMR=[['Parent or child',2376,3720,3485],['Full sibling',1613,3488,2613],['Half sibling',1160,2436,1759],['Grandparent',984,2462,1754],['Aunt or uncle',1201,2282,1740],
  ['Great-grandparent',464,1486,887],['First cousin',396,1397,866],['Half first cousin',156,1086,449],['First cousin once removed',102,980,433],['Second cousin',41,592,229],
  ['Second cousin once removed',14,316,122],['Third cousin',0,234,73],['Fourth cousin',0,139,35]];
const cmX=v=>Math.sqrt(Math.max(0,v)/3720)*100;
function cmRes(v){ const hit=CMR.filter(r=>v>=r[1]&&v<=r[2]).sort((a,b)=>Math.abs(a[3]-v)-Math.abs(b[3]-v));
  const sum=!hit.length?`No common relationship shares ${v} cM. Check the number with the testing company.`
    :`At <b>${v} cM</b>, the closest fits are ${hit.slice(0,3).map(r=>`<b>${r[0].toLowerCase()}</b>`).join(', ').replace(/, ([^,]*)$/,' or $1')}${hit.length>3?`, among ${hit.length} possibilities`:''}.`;
  return `<p class="cm-sum" style="margin:0">${sum}</p><div class="cm-rows">${CMR.map(r=>`<div class="cmr${v>=r[1]&&v<=r[2]?' on':''}"><span>${r[0]}<br><span style="font:400 11px/16px var(--f-mono);color:var(--faint)">${r[1]}–${r[2]} · avg ${r[3]}</span></span><span class="bar"><span class="rg" style="left:${cmX(r[1])}%;width:${cmX(r[2])-cmX(r[1])}%"></span><span class="av" style="left:${cmX(r[3])}%"></span><span class="cm-now" style="left:${cmX(v)}%"></span></span></div>`).join('')}</div>
  <p class="cm-note" style="margin:0">Approximate ranges and averages, after the Shared cM Project. Check exact figures with the Shared cM Project tool in your library.</p>`;
}
function cmHTML(k,X){ if(X.v==null) X.v=450;
  return xh('Try it · Shared DNA')+`<div class="ltool"><div class="cm-in"><input type="range" min="0" max="3700" step="1" value="${X.v}" data-lin="cm" data-k="${k}" aria-label="Shared centimorgans"><label class="lfield" style="flex:none"><input type="number" min="0" max="3700" value="${X.v}" data-lin="cm" data-k="${k}" inputmode="numeric" aria-label="Shared centimorgans"></label><span class="muted" style="font:400 13px/20px var(--f-mono)">cM</span></div><div class="ltool cm-res" style="margin:0">${cmRes(X.v)}</div></div>`;

/* Citation builder */
const CITE_EX=[
  {n:'Census page',who:'General Register Office',what:'1881 census of England and Wales, Bolton, Lancashire',when:'3 April 1881',win:'piece 3829, folio 12, page 18, household of James Ashworth',wis:'Findmypast, image viewed 26 October 2026'},

  {n:'Death certificate',who:'Ohio Department of Health',what:'Certificate of death, József Varga',when:'1938',win:'certificate no. 12345',wis:'Ohio History Connection, Columbus; photocopy in the family papers'},
];
const CITE_F=[['who','Who created it','The person or office'],['what','What it is','Title or description'],['when','When','Date made, or of the event'],['win','Where in','Page, entry, folio, image'],['wis','Where is','Archive, or website and date viewed']];
function citeOut(X){ const f=k=>String(X[k]||'').trim(); const ph=t=>`<span class="ph">[${t}]</span>`;
  return `${f('who')?esc(f('who')):ph('who')}, <i>${f('what')?esc(f('what')):ph('what')}</i>, ${f('when')?esc(f('when')):ph('when')}; ${f('win')?esc(f('win')):ph('where in')}; ${f('wis')?esc(f('wis')):ph('where is')}.` }
const citeText=X=>{ const f=k=>String(X[k]||'').trim(); return `${f('who')}, ${f('what')}, ${f('when')}; ${f('win')}; ${f('wis')}.` };
function citeHTML(k,X){ if(X.ex==null) Object.assign(X,CITE_EX[0],{ex:0});
  return xh('Try it · Build a citation')+`<div class="ltool"><label class="lfield">Start from an example<select data-lch="cite-ex" data-k="${k}">${CITE_EX.map((e,j)=>`<option value="${j}"${X.ex===j?' selected':''}>${e.n}</option>`).join('')}<option value="-1"${X.ex===-1?' selected':''}>Blank, for one of my records</option></select></label>
    <div class="lgrid2">${CITE_F.map(([f,lab,hint])=>`<label class="lfield">${lab}<input data-lin="cite" data-f="${f}" data-k="${k}" value="${esc(X[f]||'')}" placeholder="${esc(hint)}"></label>`).join('')}</div>

/* Research plan builder: reads the tree, suggests an objective and sources, and can add the plan to a person's notes. */
const fullName=p=>[p?.given,p?.surname].map(x=>String(x||'').trim()).filter(Boolean).join(' ')||'Unnamed';
function regionOf(place){ const s=String(place||'').toLowerCase(); if(!s) return '';
  if(/scotland/.test(s)) return 'sco'; if(/ireland|dublin|cork|galway|mayo|ulster|belfast/.test(s)) return 'ire';
  if(/england|wales|lancashire|yorkshire|london|cheshire|manchester|kent|devon|essex|surrey/.test(s)) return 'eng';
  if(/hungary|magyar|budapest|szeged/.test(s)) return 'hun';
  if(/ohio|illinois|new york|pennsylvania|usa|united states|michigan|texas|california|massachusetts/.test(s)) return 'us';
  return 'other' }
function planFor(id){
  const p=S.people.get(id); if(!p) return null; const nm=fullName(p), by=year(p.birth?.date), dy=year(p.death?.date), bp=p.birth?.place||'', dp=p.death?.place||'';
  const pars=(p.parents||[]).filter(x=>S.people.has(x)), uns=[...S.unions.values()].filter(u=>u.a===id||u.b===id), recs=[...S.sources.values()].filter(s=>(s.people||[]).includes(id)).length;
  const living=!dy&&by&&by>new Date().getFullYear()-100&&!p.death?.place;
  let obj;
  if(!pars.length) obj=`Who were the parents of ${nm}${by?`, born about ${by}`:''}${bp?` in ${bp}`:''}?`;
  else if(pars.length===1) obj=`Who was the other parent of ${nm}?`;
  else if(!by||!bp) obj=`When and where was ${nm} born?`;
  else if(!dy&&!living) obj=`When and where did ${nm} die?`;
  else if(!uns.length&&!living) obj=`Did ${nm} marry, and if so, whom?`;
  else obj=`What records survive for ${nm}’s life${bp?` in ${bp.split(',')[0]}`:''}?`;
  const known=[];
  known.push(`Born: ${[p.birth?.date,bp].filter(Boolean).join(', ')||'not yet known'}`);
  if(dy||dp) known.push(`Died: ${[p.death?.date,dp].filter(Boolean).join(', ')}`);
  known.push(`Parents: ${pars.length?pars.map(x=>fullName(S.people.get(x))).join(' and '):'not yet known'}`);
  uns.forEach(u=>{ const o=S.people.get(u.a===id?u.b:u.a); if(o) known.push(`Partner: ${fullName(o)}${u.date?`, ${u.status==='partners'?'together from':'married'} ${u.date}`:''}${u.place?`, ${u.place}`:''}`) });
  known.push(`Records linked in this app: ${recs}`);
  const R=regionOf(bp), D=regionOf(dp), src=[], lo=by||((dy||1900)-60), hi=dy||(by?by+80:1950), place=bp?bp.split(',')[0]:'the birthplace';
  const cens=(ys)=>ys.filter(y=>y>=lo&&y<=hi);
  if(R==='eng'||R==='sco'||R==='ire'||D==='eng'||D==='sco'){
    const start=R==='sco'?1855:R==='ire'?1864:1837;
    if(by&&by<start) src.push(`Parish baptism registers for ${place}, ${by-3}–${by+3} (before civil registration began in ${start})`);
    else src.push(`Birth registration index and certificate${R==='eng'?' (FreeBMD, GRO)':R==='sco'?' (ScotlandsPeople)':R==='ire'?' (IrishGenealogy.ie)':''}`);
    const cs=R==='ire'?cens([1901,1911]):cens([1841,1851,1861,1871,1881,1891,1901,1911,1921]); if(cs.length) src.push(`Census returns: ${cs.join(', ')}. Look for the household, siblings and neighbours`);
    if(!pars.length) src.push(`The marriage record: ${by&&by+20>=start?'from 1837 in England and Wales it names both fathers':'witnesses may be relatives'}`);
    if(!dy||!dp) src.push('Death registration, burial register and gravestone');
    src.push('Probate calendar and wills for parents and siblings');
  }
  if(R==='hun') src.push(`Catholic or Reformed parish registers for ${place}${by?`, ${by-3}–${by+3}`:''}${by&&by>=1895?', and civil registers (from October 1895)':''}`,`Hungaricana and Hungarian archive catalogs for ${place}`);
  if(R==='us'||D==='us'){
    const cs=cens([1850,1860,1870,1880,1900,1910,1920,1930,1940,1950]); if(cs.length) src.push(`US census returns: ${cs.join(', ')}`);
    src.push('State birth, marriage and death records (see “Where to Write for Vital Records”)','Obituaries in local newspapers');
    if(R&&R!=='us'&&D==='us') src.push('Naturalization papers and passenger lists, for the town of origin');
  }
  if(!src.length) src.push(`FamilySearch Catalog: search by place for ${bp||'each place they lived'}`,'Civil registration or church records for that place, by date','Census or census substitutes covering their lifetime');
  src.push('Records for siblings, witnesses and neighbours (the FAN club)');
  const d=new Date().toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});
  const txt=`RESEARCH PLAN · ${d}\n\nObjective\n${obj}\n\nKnown facts\n${known.map(x=>'- '+x).join('\n')}\n\nWorking hypothesis\n(Your best guess, stated so it can be tested.)\n\nSources to search\n${src.map((x,j)=>`${j+1}. ${x}`).join('\n')}\n\nResults\n- `;
  return {nm,txt};
}
function planHTML(k,X){
  if(!S.people.size) return xh('Try it · Research plan')+`<p style="margin:var(--s3) 0 var(--s4);color:var(--muted)">Your tree is empty. Add yourself first, then come back to plan your first search.</p><button class="btn primary sm" data-act="new-person">Add yourself</button>`;
  if(!X.p||!S.people.has(X.p)) X.p=homeId();
  const pl=planFor(X.p); if(X.txt==null) X.txt=pl.txt;

/* Your tree, at a glance: the gaps worth working on first. */
function ytHTML(){
  if(!S.people.size) return xh('Your tree')+`<p style="margin:var(--s3) 0 var(--s4);color:var(--muted)">Your tree is empty. Start with yourself: name, birth date and birthplace.</p><button class="btn primary sm" data-act="new-person">Add yourself</button>`;
  const ps=[...S.people.entries()], src=[...S.sources.values()];
  const noBirth=ps.filter(([,p])=>!year(p.birth?.date)||!p.birth?.place).length, noRec=ps.filter(([id])=>!src.some(s=>(s.people||[]).includes(id))).length;
  const home=homeId(), seen=new Set([home]), q=[home], gaps=[];
  while(q.length&&gaps.length<4){ const id=q.shift(), p=S.people.get(id); if(!p) continue; const pars=(p.parents||[]).filter(x=>S.people.has(x)); if(pars.length<2) gaps.push(id); pars.forEach(x=>{ if(!seen.has(x)){ seen.add(x); q.push(x) } }) }
  return xh('Your tree')+`<div class="ltool"><div class="yt-grid"><div class="yt-stat"><b>${ps.length}</b><span>${ps.length===1?'person':'people'} in your tree</span></div><div class="yt-stat"><b>${noBirth}</b><span>missing a birth date or place</span></div><div class="yt-stat"><b>${noRec}</b><span>with no records linked yet</span></div></div>
    ${gaps.length?`<div class="lsub">Your direct line stops here</div><p style="margin:0;color:var(--muted);font-size:14px;line-height:20px">The closest generations with a missing parent. Work on these first.</p><div class="yt-who">${gaps.map(id=>chip(id)).join('')}</div>`:''}</div>`;
}
