async function submitFact(form){
  const fd=new FormData(form);
  const patch={date:fd.get('date').trim(),place:fd.get('place').trim(),hunt:!!fd.get('hunt'),where:(fd.get('where')||'').trim()};
  if(factCtx.type==='event') patch.note=(fd.get('note')||'').trim();
  if(factCtx.type==='union') patch.status=fd.get('status')||'married';
  let key=factCtx.key;
  if(factCtx.newPid){
    const pid=factCtx.newPid, type=fd.get('type');
    if(type==='Death'){ key=`${pid}|death`; await saveFact(key,{date:patch.date,place:patch.place,hunt:patch.hunt,where:patch.where}) }
    else { const p=clone(S.people.get(pid)); const e={id:uid('e'),type,...patch}; p.events=[...(p.events||[]),e]; key=`${pid}|e|${e.id}`; await put('people',pid,p) }
  } else {
    if(factCtx.type==='event') patch.type=fd.get('type');
    await saveFact(key,patch);
  }
  const want=new Set(fd.getAll('doc'));
  for(const box of $$('input[name=doc]',form)){
    const s=S.sources.get(box.value); if(!s) continue; const has=(s.facts||[]).includes(key);
    if(want.has(box.value)&&!has) await patch('sources',box.value,{facts:[...(s.facts||[]),key]});
    if(!want.has(box.value)&&has) await patch('sources',box.value,{facts:s.facts.filter(k=>k!==key)});
  }
  return key;
}

  s.people=s.people.filter(p=>S.people.has(p)); s.facts=uniq((s.facts||[]).filter(k=>factData(k)));
  const file=docCtx.file;
  if(file&&canFiles()){
    const btn=$('#d-save'); btn.disabled=true; btn.textContent='Uploading…';
    try{
      const ext=(file.name.split('.').pop()||'').toLowerCase();
      const map={pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',txt:'text/plain',csv:'text/csv',md:'text/markdown'};
      const type=['application/pdf','image/jpeg','image/png','image/gif','image/webp','text/plain','text/csv','text/markdown'].includes(file.type)?file.type:map[ext];
      const r=await storeAsset(file,type);

    }catch(e){ fail(e); btn.disabled=false; btn.textContent='Save'; return false }
  }

}

function pickFiles(accept,multiple,cb){ const i=document.createElement('input'); i.type='file'; i.accept=accept; i.multiple=multiple; i.onchange=()=>{ const fs=[...(i.files||[])]; if(fs.length) cb(fs) }; i.click() }

// Framing: drag to move, pinch, scroll or use the slider to zoom. The ring shows exactly what the node will show.
let cropCtx=null;
function openCropper(pid,src){
  const url=src.file?URL.createObjectURL(src.file):`${blobUrl(src.asset)}`;
  cropCtx={pid,src,url,z:1,z0:1,ox:0,oy:0,w:0,h:0,S:0};
  openModal(`<div class="dlg"><h2>Frame the photo</h2>
    <div class="cropper" id="cropper"><img id="crop-img" alt="" draggable="false"><div class="ring"></div></div>
    <label class="crop-zoom"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="currentColor"/></svg><input type="range" id="crop-z" min="1" max="6" step="0.01" value="1" aria-label="Zoom"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="currentColor"/></svg></label>
    <p class="crop-hint">Drag to move · pinch or slide to zoom</p>
    <div class="dlg-foot"><button class="btn" data-act="portrait">Back</button><button class="btn primary" id="crop-save" data-act="crop-save" disabled>Use photo</button></div></div>`);
  const img=$('#crop-img'), box=$('#cropper');
  img.onload=()=>{ const c=cropCtx; if(!c||!box) return; c.w=img.naturalWidth; c.h=img.naturalHeight; c.S=box.clientWidth;
    const D=c.S*.8; c.z0=D/Math.min(c.w,c.h);
    const k=src.crop&&cropOK(src.crop)?src.crop:null;
    if(k){ c.z=Math.max(1,D/(k.d*c.w)/c.z0); const s=c.z0*c.z; c.ox=c.S/2-k.cx*c.w*s; c.oy=c.S/2-k.cy*c.h*s }
    else { c.z=1; const s=c.z0; c.ox=(c.S-c.w*s)/2; c.oy=(c.S-c.h*s)/2 }
    $('#crop-z').value=c.z; applyCrop(); $('#crop-save').disabled=false };
  img.onerror=()=>toast('That image could not be opened.');
  img.src=url;
  const P=new Map(); let pinch=null;
  box.addEventListener('pointerdown',e=>{ box.setPointerCapture(e.pointerId); P.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(P.size===2){ const [a,b]=[...P.values()]; pinch=Math.hypot(a.x-b.x,a.y-b.y) } });
  box.addEventListener('pointermove',e=>{ const prev=P.get(e.pointerId); if(!prev||!cropCtx) return; const cur={x:e.clientX,y:e.clientY}; P.set(e.pointerId,cur);
    if(P.size===1){ cropCtx.ox+=cur.x-prev.x; cropCtx.oy+=cur.y-prev.y; applyCrop() }
    else if(P.size===2&&pinch){ const [a,b]=[...P.values()], d=Math.hypot(a.x-b.x,a.y-b.y), r=box.getBoundingClientRect(); zoomCrop(cropCtx.z*d/pinch,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top); pinch=d } });
  const end=e=>{ P.delete(e.pointerId); if(P.size<2) pinch=null };
  box.addEventListener('pointerup',end); box.addEventListener('pointercancel',end);
  box.addEventListener('wheel',e=>{ e.preventDefault(); const r=box.getBoundingClientRect(); zoomCrop(cropCtx.z*Math.exp(-e.deltaY*.0025),e.clientX-r.left,e.clientY-r.top) },{passive:false});
  $('#crop-z').addEventListener('input',e=>{ const c=cropCtx; zoomCrop(+e.target.value,c.S/2,c.S/2) });
}
function zoomCrop(z,px,py){ const c=cropCtx; if(!c?.w) return; z=Math.min(6,Math.max(1,z)); const s0=c.z0*c.z, s1=c.z0*z;
  c.ox=px-(px-c.ox)*s1/s0; c.oy=py-(py-c.oy)*s1/s0; c.z=z; const r=$('#crop-z'); if(r) r.value=z; applyCrop() }
function applyCrop(){ const c=cropCtx, img=$('#crop-img'); if(!c?.w||!img) return; const s=c.z0*c.z, D=c.S*.8, lo=c.S*.1, hi=c.S*.9;

  c.ox=Math.min(lo,Math.max(hi-c.w*s,c.ox)); c.oy=Math.min(lo,Math.max(hi-c.h*s,c.oy));
  img.style.width=c.w+'px'; img.style.height=c.h+'px'; img.style.transform=`translate(${c.ox}px,${c.oy}px) scale(${s})` }
async function saveCrop(){
  const c=cropCtx; if(!c?.w) return; const s=c.z0*c.z, D=c.S*.8;
  const crop={cx:(c.S/2-c.ox)/(c.w*s), cy:(c.S/2-c.oy)/(c.h*s), d:D/(c.w*s), a:c.h/c.w};
  const btn=$('#crop-save'); btn.disabled=true; btn.textContent='Saving…';
  try{
    let asset=c.src.asset;
    // a photo from the device is kept whole in Records; the node only shows the framed circle of it
    if(c.src.file){ const r=await uploadFile(c.pid,c.src.file,{title:'Portrait · '+short(S.people.get(c.pid))}); asset=r.asset; URL.revokeObjectURL(c.url) }
    await patch('people',c.pid,{photo:asset,photoCrop:crop});
    cropCtx=null; closeModal(); haptic(); pulseAfter('.portrait .ava'); toast(c.src.file?'Profile photo set · full photo saved to Records':'Profile photo set');
  }catch(e){ fail(e); btn.disabled=false; btn.textContent='Use photo' }
}

/* ---------- relationship actions ---------- */
async function linkParent(child,par){
  const parents=uniq([...(S.people.get(child).parents||[]).filter(x=>S.people.has(x)),par]).slice(0,2); await patch('people',child,{parents});
  if(parents.length===2&&!unionBetween(...parents)) await put('unions',uid('u'),{a:parents[0],b:parents[1],status:'married',date:'',place:''});
}
async function linkChild(par,other,child){
  // the chosen parent pair replaces any earlier parents: a child has at most two
  const old=(S.people.get(child).parents||[]).filter(x=>S.people.has(x));
  const parents=uniq([par,other,...(other?[]:old)].filter(Boolean)).slice(0,2);
  await patch('people',child,{parents});
}
// Drop document links to facts that no longer exist (a deleted event, partnership or person).
/* ---------- archive ---------- */
// Nothing linked to a deleted event, partnership, link or person is lost: each deletion files one archive entry
// holding a snapshot of what was removed and every document that was attached, so it can be restored or re-filed.
// A document entry: {sid, data: the record as it was, facts: links removed, people: people removed, moved: record left the tree}
const docEntry=(sid,s,facts=[],people=[],moved=false,ref=false)=>({sid,data:clone(s),facts,people,moved,ref});
async function unlinkFactEverywhere(test){
  const match=typeof test==='string'?k=>k===test:test, out=[];
  for(const [sid,s] of [...S.sources]) if((s.facts||[]).some(match)){ out.push(docEntry(sid,s,s.facts.filter(match))); await patch('sources',sid,{facts:s.facts.filter(k=>!match(k))}) }
  return out;
}
const namesOf=ids=>Object.fromEntries(ids.filter(id=>S.people.has(id)).map(id=>[id,nm(S.people.get(id))]));
async function archiveAdd(item){ const id=uid('a'); await put('archive',id,{at:Date.now(),docs:[],...item}); pulseAfter('.tab .badge.quiet'); return id }
const relatedDocs=(a,b)=>[...S.sources.entries()].filter(([,s])=>(s.people||[]).includes(a)&&(s.people||[]).includes(b)).map(([sid,s])=>docEntry(sid,s,[],[],false,true));
async function removeUnion(u,archive=true){
  const x=S.unions.get(u); if(!x) return [];
  await remove('unions',u); const docs=await unlinkFactEverywhere(`u|${u}`);
  if(archive) await archiveAdd({kind:'Partnership',title:`${nm(S.people.get(x.a))} & ${nm(S.people.get(x.b))}`,sub:[x.status==='partners'?'Partners':x.status==='divorced'?'Married, divorced':'Married',x.date,x.place].filter(Boolean).join(' · '),
    people:[x.a,x.b],names:namesOf([x.a,x.b]),restore:{uid:u,union:clone(x)},docs});
  return docs;
}
async function unlinkParentChild(child,parent){
  const c=S.people.get(child), p=S.people.get(parent); if(!c||!p) return;
  await patch('people',child,{parents:(c.parents||[]).filter(x=>x!==parent)});
  await archiveAdd({kind:'Parent link',title:`${nm(p)} → ${nm(c)}`,sub:'Parent and child',people:[parent,child],names:namesOf([parent,child]),restore:{child,parent},docs:relatedDocs(parent,child)});
  toast('Link moved to Archive');
}
async function deletePerson(id){
  const p=S.people.get(id); if(!p) return;
  const names=namesOf([id]), unions=[], children=[], byDoc=new Map();
  const note=(sid,s,facts,people,moved)=>{ const e=byDoc.get(sid)||docEntry(sid,s); e.facts=uniq([...e.facts,...facts]); e.people=uniq([...e.people,...people]); e.moved=e.moved||moved; byDoc.set(sid,e) };
  for(const [u,x] of [...S.unions]) if(x.a===id||x.b===id){ unions.push([u,clone(x)]); Object.assign(names,namesOf([x.a,x.b])); const d=await removeUnion(u,false); d.forEach(e=>note(e.sid,e.data,e.facts,[],false)) }
  for(const [cid,c] of [...S.people]) if((c.parents||[]).includes(id)){ children.push(cid); Object.assign(names,namesOf([cid])); await patch('people',cid,{parents:c.parents.filter(x=>x!==id)}) }
  for(const [sid,s] of [...S.sources]) if((s.people||[]).includes(id)){
    const left=s.people.filter(x=>x!==id), facts=(s.facts||[]).filter(k=>k.startsWith(id+'|'));
    note(sid,s,facts,[id],!left.length);
    if(!left.length) await remove('sources',sid);   // the file itself is kept for the archive
    else await patch('sources',sid,{people:left,facts:(s.facts||[]).filter(k=>!k.startsWith(id+'|'))});
  }
  (await unlinkFactEverywhere(k=>k.startsWith(id+'|'))).forEach(e=>note(e.sid,e.data,e.facts,[],false));
  const m=meta();
  await archiveAdd({kind:'Person',title:nm(p),sub:span(p),people:[id],names,restore:{pid:id,person:clone(p),unions,children,wasMe:m.me===id,wasRoot:m.root===id},docs:[...byDoc.values()]});
  await remove('people',id);
  if(m.me===id||m.root===id) await setMeta({me:m.me===id?null:m.me,root:m.root===id?null:m.root});
}
async function deleteEvent(key){

// Put a document back the way it was: recreate it if it left the tree, otherwise re-add the people and links it lost.
const canRestoreDoc=d=>{ const cur=S.sources.get(d.sid); if(!cur) return (d.data.people||[]).some(p=>S.people.has(p));
  return d.facts.some(k=>factData(k)&&!(cur.facts||[]).includes(k))||d.people.some(p=>S.people.has(p)&&!(cur.people||[]).includes(p)) };
async function restoreDoc(d){
  const cur=S.sources.get(d.sid);
  if(!cur){ const data=clone(d.data); data.people=(data.people||[]).filter(p=>S.people.has(p)); data.facts=(data.facts||[]).filter(k=>factData(k)); if(!data.people.length) return false; await put('sources',d.sid,data); return true }
  await patch('sources',d.sid,{people:uniq([...(cur.people||[]),...d.people.filter(p=>S.people.has(p))]),facts:uniq([...(cur.facts||[]),...d.facts.filter(k=>factData(k))])});
  return true;
}
async function restoreEntry(aid){
  const it=S.archive.get(aid); if(!it) return; const r=it.restore||{}, who=id=>it.names?.[id]||'That person';
  if(it.kind==='Event'){ if(!S.people.has(r.pid)) return toast(`${who(r.pid)} is no longer in the tree. Restore them first.`);
    const p=S.people.get(r.pid); await patch('people',r.pid,{events:[...(p.events||[]).filter(e=>e.id!==r.event.id),r.event]}) }
  if(it.kind==='Partnership'){ const miss=[r.union.a,r.union.b].find(x=>!S.people.has(x)); if(miss) return toast(`${who(miss)} is no longer in the tree. Restore them first.`); await put('unions',r.uid,r.union) }
  if(it.kind==='Parent link'){ const miss=[r.child,r.parent].find(x=>!S.people.has(x)); if(miss) return toast(`${who(miss)} is no longer in the tree. Restore them first.`);
    if((S.people.get(r.child).parents||[]).filter(x=>S.people.has(x)).length>=2) return toast(`${who(r.child)} already has two parents. Remove one first.`);
    await linkParent(r.child,r.parent) }
  if(it.kind==='Person'){ await put('people',r.pid,r.person);
    for(const [u,x] of r.unions||[]) if(S.people.has(x.a===r.pid?x.b:x.a)) await put('unions',u,x);
    for(const c of r.children||[]){ const cp=S.people.get(c); if(cp&&(cp.parents||[]).length<2) await patch('people',c,{parents:uniq([...(cp.parents||[]),r.pid])}) }
    if(r.wasMe&&!meId()) await setMeta({me:r.pid}) }
  for(const d of it.docs||[]) await restoreDoc(d);
  await remove('archive',aid); haptic(); toast(`${it.kind} restored`);
}
async function restoreOneDoc(aid,sid){
  const it=S.archive.get(aid), d=it?.docs.find(x=>x.sid===sid); if(!d) return;
  if(!(await restoreDoc(d))) return toast('No one this document belonged to is in the tree. Use “Add to…” instead.');

}
// File documents under a different person and, optionally, one of their events.
async function fileDocsUnder(aid,sids,pid,key){
  const it=S.archive.get(aid); if(!it) return;
  for(const sid of sids){ const d=it.docs.find(x=>x.sid===sid); if(!d) continue; const cur=S.sources.get(sid);
    if(!cur){ const data=clone(d.data); data.people=[pid]; data.facts=key?[key]:[]; await put('sources',sid,data) }
    else await patch('sources',sid,{people:uniq([...(cur.people||[]),pid]),facts:key?uniq([...(cur.facts||[]),key]):(cur.facts||[])}) }

async function discardEntry(aid){
  const it=S.archive.get(aid); if(!it) return; await remove('archive',aid);
  // files whose record no longer exists anywhere are deleted for good
  const inUse=a=>[...S.sources.values()].some(s=>s.asset===a)||[...S.archive.values()].some(x=>(x.docs||[]).some(d=>d.data.asset===a));
  for(const d of it.docs||[]) if(!S.sources.has(d.sid)&&d.data.asset&&!inUse(d.data.asset)) dropAsset(d.data.asset);

/* ---------- import / export ---------- */
const GED_EV={BAPM:'Baptism',CHR:'Baptism',RESI:'Residence',CENS:'Census',OCCU:'Occupation',EDUC:'Education',IMMI:'Immigration',EMIG:'Emigration',NATU:'Naturalization',RELI:'Religious',BURI:'Burial',CREM:'Burial',PROB:'Probate',WILL:'Probate',RETI:'Retirement',GRAD:'Education',CONF:'Religious',ORDN:'Religious',_MILT:'Military',_MIL:'Military'};
const EV_GED=Object.fromEntries(['BAPM','RESI','CENS','OCCU','EDUC','IMMI','EMIG','NATU','RELI','BURI','PROB','RETI'].map(t=>[GED_EV[t],t]));
const ALT_GED={birth:'Birth name',maiden:'Birth name',married:'Married name',aka:'Also known as',nickname:'Nickname',immigrant:'Anglicized',religious:'Religious name'};
function parseGed(text){
  const root={kids:[]}, stack=[root];
  for(const raw of text.replace(/^﻿/,'').split(/\r\n|\r|\n/)){
    const m=raw.trim().match(/^(\d+)\s+(@[^@]+@\s+)?(\S+)(?:\s(.*))?$/); if(!m) continue;
    const lvl=+m[1], node={id:m[2]?.trim(),tag:m[3].toUpperCase(),val:m[4]||'',kids:[]};
    if(node.tag==='CONT'||node.tag==='CONC'){ const p=stack[lvl]; if(p){ p.val+=(node.tag==='CONT'?'\n':'')+node.val } continue }
    stack.length=lvl+1; (stack[lvl]||root).kids.push(node); stack[lvl+1]=node;
  }
  return root.kids;
}
const gk=(n,t)=>n.kids.find(k=>k.tag===t);
const gv=(n,t)=>gk(n,t)?.val?.trim()||'';
function gedToStore(text){
  const recs=parseGed(text), ids=new Map(), out={people:{},unions:{},sources:{}};
  const sourceRecs=new Map(recs.filter(r=>r.tag==='SOUR'&&r.id).map(r=>[r.id,r]));
  const cites=new Map(); // source xref -> {people:Set, facts:Set}
  const cite=(node,pid,key)=>{ for(const s of node.kids.filter(k=>k.tag==='SOUR'&&/^@/.test(k.val))){ const c=cites.get(s.val)||{people:new Set(),facts:new Set()}; c.people.add(pid); if(key) c.facts.add(key); cites.set(s.val,c) } };
  for(const r of recs.filter(r=>r.tag==='INDI')){
    const id=uid('p'); ids.set(r.id,id);
    const names=r.kids.filter(k=>k.tag==='NAME');
    const split=n=>{ const g=gv(n,'GIVN'), s=gv(n,'SURN'); if(g||s) return [g,s]; const mm=n.val.match(/^([^/]*)\/([^/]*)\/?(.*)$/); return mm?[(mm[1]+' '+mm[3]).trim(),mm[2].trim()]:[n.val.trim(),''] };
    const [given,surname]=names[0]?split(names[0]):['',''];
    const altNames=names.slice(1).map(n=>{const [g,s]=split(n); return {type:ALT_GED[gv(n,'TYPE').toLowerCase()]||'Also known as',name:[g,s].filter(Boolean).join(' '),note:''}}).filter(a=>a.name);
    for(const n of names){ const nick=gv(n,'NICK'); if(nick) altNames.push({type:'Nickname',name:nick,note:''}) }
    const fact=t=>{const n=gk(r,t); return n?{date:gv(n,'DATE'),place:gv(n,'PLAC')}:{date:'',place:''}};
    const events=[];
    for(const k of r.kids){
      const type=GED_EV[k.tag]||(k.tag==='EVEN'||k.tag==='FACT'?(gv(k,'TYPE')||'Other'):null); if(!type) continue;
      const e={id:uid('e'),type,date:gv(k,'DATE'),place:gv(k,'PLAC'),note:[k.val,gv(k,'NOTE')].filter(Boolean).join(' · '),hunt:false,where:''};
      events.push(e); cite(k,id,`${id}|e|${e.id}`);
    }
    const notes=r.kids.filter(k=>k.tag==='NOTE'&&!/^@/.test(k.val)).map(k=>k.val).join('\n\n');
    const sx=gv(r,'SEX').toUpperCase();
    out.people[id]={given,surname,sex:sx==='M'||sx==='F'?sx:'U',birth:fact('BIRT'),death:fact('DEAT'),parents:[],events,altNames,notes};
    if(gk(r,'BIRT')) cite(gk(r,'BIRT'),id,`${id}|birth`);
    if(gk(r,'DEAT')) cite(gk(r,'DEAT'),id,`${id}|death`);
    cite(r,id,null);
  }
  for(const f of recs.filter(r=>r.tag==='FAM')){
    const h=ids.get(gv(f,'HUSB')), w=ids.get(gv(f,'WIFE')), ps=[h,w].filter(Boolean);
    let ukey=null;
    if(h&&w){ const u=uid('u'), mar=gk(f,'MARR'); out.unions[u]={a:h,b:w,status:gk(f,'DIV')?'divorced':'married',date:mar?gv(mar,'DATE'):'',place:mar?gv(mar,'PLAC'):'',hunt:false,where:''}; ukey=`u|${u}`; if(mar) cite(mar,h,ukey) }
    for(const c of f.kids.filter(k=>k.tag==='CHIL')){ const cid=ids.get(c.val); if(cid) out.people[cid].parents=ps.slice(0,2) }
  }
  for(const [xref,c] of cites){
    const r=sourceRecs.get(xref);
    out.sources[uid('s')]={title:(r&&(gv(r,'TITL')||gv(r,'ABBR')))||'Source',kind:'Other',date:'',link:'',notes:r?[gv(r,'AUTH'),gv(r,'PUBL'),gv(r,'REPO')].filter(Boolean).join(' · '):'',people:[...c.people],facts:[...c.facts]};
  }
  return out;
}
function gedDate(s){ s=String(s||'').trim(); const iso=s.match(/^(\d{4})-(\d{1,2})(?:-(\d{1,2}))?$/); if(iso) return [iso[3]?+iso[3]:'',MONTHS[+iso[2]-1]||'',iso[1]].filter(Boolean).join(' ').toUpperCase(); return s.replace(/\babt\.?\b/i,'ABT').replace(/\bc\.\s*/i,'ABT ').replace(/\bbef\.?\b/i,'BEF').replace(/\baft\.?\b/i,'AFT').toUpperCase() }
function storeToGed(){
  const L=['0 HEAD','1 SOUR LOTUS_LINEAGE','1 GEDC','2 VERS 5.5.1','2 FORM LINEAGE-LINKED','1 CHAR UTF-8'];
  const xi=new Map([...S.people.keys()].map((id,i)=>[id,`@I${i+1}@`])), xs=new Map([...S.sources.keys()].map((id,i)=>[id,`@S${i+1}@`]));
  const txt=(lvl,tag,v)=>{ const lines=String(v).split('\n'); L.push(`${lvl} ${tag} ${lines[0]}`.trimEnd()); lines.slice(1).forEach(x=>L.push(`${lvl+1} CONT ${x}`.trimEnd())) };
  const srcFor=key=>docsFor(key).map(([sid])=>xs.get(sid));
  const fact=(tag,d,key,extra)=>{ if(!d||!(d.date||d.place||srcFor(key).length||extra)) return; L.push(`1 ${tag}${extra?' '+extra:''}`); if(d.date) L.push(`2 DATE ${gedDate(d.date)}`); if(d.place) L.push(`2 PLAC ${d.place}`); srcFor(key).forEach(x=>L.push(`2 SOUR ${x}`)) };
  const fams=new Map(); // key -> {h,w,u,kids}
  for(const [u,x] of S.unions){ if(!S.people.has(x.a)||!S.people.has(x.b)) continue; const k=[x.a,x.b].sort().join('+'); fams.set(k,{ps:[x.a,x.b],u,kids:[]}) }
  for(const [id,ps] of R.par){ if(!ps.length) continue; const k=[...ps].sort().join('+'); if(!fams.has(k)) fams.set(k,{ps:[...ps],u:null,kids:[]}); fams.get(k).kids.push(id) }
  const fx=new Map([...fams.keys()].map((k,i)=>[k,`@F${i+1}@`]));
  for(const [id,p] of S.people){
    L.push(`0 ${xi.get(id)} INDI`); L.push(`1 NAME ${p.given||''} /${p.surname||''}/`.replace(/\s+\//,' /'));
    if(p.given) L.push(`2 GIVN ${p.given}`); if(p.surname) L.push(`2 SURN ${p.surname}`);
    for(const a of (p.altNames||[])){ const parts=a.name.trim().split(/\s+/); const s=parts.length>1?parts.pop():''; L.push(`1 NAME ${parts.join(' ')} /${s}/`); const t=Object.entries(ALT_GED).find(([,v])=>v===a.type)?.[0]; L.push(`2 TYPE ${t||'aka'}`); if(a.note) L.push(`2 NOTE ${a.note}`) }
    L.push(`1 SEX ${p.sex==='M'||p.sex==='F'?p.sex:'U'}`);
    fact('BIRT',p.birth,`${id}|birth`);
    for(const e of (p.events||[])){ const t=EV_GED[e.type]; const key=`${id}|e|${e.id}`;
      if(t) fact(t,e,key,t==='OCCU'?e.note:''); else { L.push('1 EVEN'); L.push(`2 TYPE ${e.type||'Other'}`); if(e.date) L.push(`2 DATE ${gedDate(e.date)}`); if(e.place) L.push(`2 PLAC ${e.place}`); srcFor(key).forEach(x=>L.push(`2 SOUR ${x}`)) }
      if(e.note&&t!=='OCCU') txt(2,'NOTE',e.note) }
    fact('DEAT',p.death,`${id}|death`);
    if(p.notes) txt(1,'NOTE',p.notes);
    for(const [k,f] of fams){ if(f.kids.includes(id)) L.push(`1 FAMC ${fx.get(k)}`); if(f.ps.includes(id)) L.push(`1 FAMS ${fx.get(k)}`) }
    for(const [sid,s] of S.sources) if((s.people||[]).includes(id)&&!(s.facts||[]).some(k=>k.startsWith(id+'|'))) L.push(`1 SOUR ${xs.get(sid)}`);
  }
  for(const [k,f] of fams){
    L.push(`0 ${fx.get(k)} FAM`);
    const sorted=[...f.ps].sort((a,b)=>(S.people.get(a)?.sex==='F')-(S.people.get(b)?.sex==='F'));
    if(sorted[0]) L.push(`1 HUSB ${xi.get(sorted[0])}`); if(sorted[1]) L.push(`1 WIFE ${xi.get(sorted[1])}`);
    f.kids.forEach(c=>L.push(`1 CHIL ${xi.get(c)}`));
    if(f.u){ const x=S.unions.get(f.u); fact('MARR',{date:x.date,place:x.place},`u|${f.u}`, x.date||x.place?'':'Y'); if(x.status==='divorced') L.push('1 DIV Y') }
  }
  for(const [sid,s] of S.sources){ L.push(`0 ${xs.get(sid)} SOUR`); L.push(`1 TITL ${s.title||'Untitled'}`); if(s.date) L.push(`1 DATE ${s.date}`); if(s.link) L.push(`1 PUBL ${s.link}`); if(s.notes) txt(1,'NOTE',s.notes) }
  L.push('0 TRLR'); return L.join('\n');
}
async function writeAll(data){
  const jobs=[]; for(const c of ['people','unions','sources','saved','meta']) for(const [id,d] of Object.entries(data[c]||{})) jobs.push([c,id,d]);
  let done=0; toast(`Importing ${jobs.length} records…`);
  const worker=async()=>{ while(jobs.length){ const [c,id,d]=jobs.shift(); await put(c,id,d); if(++done%50===0) toast(`Imported ${done}…`) } };
  await Promise.all(Array.from({length:6},worker));
  toast(`Imported ${done} records`);
}
let importData=null;
function pickImport(){
  const i=document.createElement('input'); i.type='file'; i.accept='.ged,.json,text/plain,application/json';
  i.onchange=async()=>{ const f=i.files[0]; if(!f) return; let text; try{ text=await f.text() }catch{ toast('Couldn’t read that file.'); return }
    try{
      if(/\.json$/i.test(f.name)||text.trim().startsWith('{')){ const j=JSON.parse(text); if(j.format!=='lotus-lineage') throw 0; importData={kind:'backup',data:j} }
      else { if(!/^\s*(﻿)?0\s+HEAD/.test(text)) throw 0; importData={kind:'ged',data:gedToStore(text)} }
    }catch{ toast('That file isn’t a GEDCOM or a Book of the Dead backup.'); return }
    const d=importData.data, n=c=>Object.keys(d[c]||{}).length;
    openModal(`<div class="dlg"><h2>Import ${esc(f.name)}</h2>
      <p style="margin:0">${n('people')} people · ${n('unions')} partnerships · ${n('sources')} documents${n('files')?` · ${n('files')} files`:''}</p>
      <p class="muted" style="margin:0">${importData.kind==='ged'?'They’ll be added alongside the people already here. Merge any duplicates afterwards.':'Records from the backup replace records with the same ID; everything else stays.'}</p>
      <div class="dlg-foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="import-go">Import</button></div></div>`);
  }; i.click();
}
async function saveFile(filename,data){
  if(!DL){ try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:/\.json$/.test(filename)?'application/json':'text/plain'})); a.download=filename.replace(/\.ged\.txt$/,'.ged'); document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove() },1000); return true }catch{ toast('Couldn’t save the file.'); return false } }
  try{ await DL.save({filename,data}); return true }catch(e){ if(e?.code!=='declined') toast(e?.code==='rejected_extension'?'That file type can’t be saved here.':'Couldn’t save the file. Try again.'); return false }
}

/* seeded random, used by the tree connectors */
function rngf(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296 } }

/* ---------- splash ---------- */
// Once per session: the root draws down the left side, the name settles in beside it, then it fades.
function splash(){
  const el=$('#splash'); if(!el) return;
  let seen=false; try{ seen=sessionStorage.getItem('bod-splash')==='1' }catch{}
  if(seen){ el.remove(); return }
  try{ sessionStorage.setItem('bod-splash','1') }catch{}
  el.hidden=false; const t0=performance.now(); let gone=false;
  const leave=()=>{ if(gone) return; gone=true; el.classList.add('leaving');
    if(state.growAfterSplash){ state.growAfterSplash=false; setTimeout(()=>{ const vp=$('#vp'); if(vp){ playTree('grow'); vp.style.opacity='' } },120) }
    setTimeout(()=>el.remove(),520) };
  el.addEventListener('click',leave); addEventListener('keydown',leave,{once:true});
  const min=REDUCED.matches?700:2300;
  const wait=()=>{ if(gone) return; if(READY&&performance.now()-t0>=min) leave(); else setTimeout(wait,100) };
  wait(); setTimeout(leave,6000);
}

/* ---------- gestures ---------- */
// Where a horizontal swipe leads from the current view. Tabs page left and right; on a profile,
// swiping left opens the Circle view and swiping right goes back, like an iOS navigation stack.
function swipeTargets(){
  if(state.view==='person'){
    const id=state.id;
    if(state.mode==='circle') return { prev:()=>go(id,'in-left'), next:null };
    const i=Math.max(0,PTABS.indexOf(state.ptab));
    return { prev:i>0?()=>{ state.ptab=PTABS[i-1]; navDir='in-left'; render() }:()=>go(state.backTo||'people','in-left'),
             next:i<PTABS.length-1?()=>{ state.ptab=PTABS[i+1]; navDir='in-right'; render() }:null };
  }
  if(state.view==='lesson'){ const k=lessonIdx(state.lessonId), nx=LES?.lessons[k+1]; return { prev:()=>go('learn','in-left'), next:nx?()=>go('learn/'+nx.id,'in-right'):null } }
  const i=ORDER.indexOf(state.view==='learn'?'library':state.view);
  return { prev:i>0?()=>{ goHome(ORDER[i-1]); go(tabTok(ORDER[i-1]),'in-left') }:null, next:i>=0&&i<ORDER.length-1?()=>{ goHome(ORDER[i+1]); go(tabTok(ORDER[i+1]),'in-right') }:null };
}
// Follows the finger, rubber-bands where there is nowhere to go, and commits on distance or a flick.
function bindSwipe(){
  const main=$('#main'); let g=null;
  const reset=()=>{ g=null };
  main.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'||state.view==='tree'||dlg.open||!READY) return;
    if(e.target.closest('input,textarea,select,.srow,.notes,[data-noswipe]')) return;
    g={x:e.clientX,y:e.clientY,t:performance.now(),id:e.pointerId,on:false,dx:0};
  },{passive:true});
  main.addEventListener('pointermove',e=>{
    if(!g||e.pointerId!==g.id) return;
    const dx=e.clientX-g.x, dy=e.clientY-g.y;
    if(!g.on){
      if(Math.abs(dx)>14&&Math.abs(dx)>Math.abs(dy)*1.5){ g.on=true; g.el=main.firstElementChild; g.tg=swipeTargets(); g.el.style.transition='none'; g.el.style.willChange='transform'; try{main.setPointerCapture(e.pointerId)}catch{} }
      else if(Math.abs(dy)>14) reset();
      return;
    }
    const can=dx<0?g.tg.next:g.tg.prev; const x=can?dx:dx*0.22;
    g.dx=dx; g.el.style.transform=`translate3d(${x}px,0,0)`; g.el.style.opacity=String(1-Math.min(.4,Math.abs(x)/main.clientWidth*.7));
  });
  const end=e=>{
    if(!g||e.pointerId!==g.id) return; const s=g; reset(); if(!s.on) return;
    const w=main.clientWidth, v=s.dx/Math.max(1,performance.now()-s.t), el=s.el;
    const fwd=(s.dx<-w*.28||v<-.55)&&s.tg.next, back=(s.dx>w*.28||v>.55)&&s.tg.prev;
    el.style.transition='transform .26s cubic-bezier(.32,.72,0,1), opacity .26s';
    if(fwd||back){
      haptic(); el.style.transform=`translate3d(${fwd?-w*.45:w*.45}px,0,0)`; el.style.opacity='0';
      setTimeout(()=>{ (fwd?s.tg.next:s.tg.prev)() },150);
    } else { el.style.transform=''; el.style.opacity=''; setTimeout(()=>{ el.style.transition=''; el.style.willChange='' },280) }
  };
  main.addEventListener('pointerup',end); main.addEventListener('pointercancel',end);
}
// Shrinks a row closed, then runs the change, so a removed item never just blinks out.
function collapseRow(row,then){
  if(!row||REDUCED.matches){ row?.remove(); then(); return }
  const h=row.offsetHeight; row.style.height=h+'px'; row.style.overflow='hidden'; void row.offsetWidth;
  row.style.transition='height .28s cubic-bezier(.32,.72,0,1), opacity .2s, margin .28s, transform .28s cubic-bezier(.32,.72,0,1)';
  row.style.height='0px'; row.style.opacity='0'; row.style.marginBottom='0'; row.style.marginTop='0';
  setTimeout(()=>{ row.remove(); then() },290);
}
// To find rows: swipe left to reveal "Found", swipe far or flick to mark it found (like Mail).
function bindRowSwipe(){
  const main=$('#main'); let r=null;
  main.addEventListener('pointerdown',e=>{
    const row=e.target.closest('.srow'); if(!row||e.target.closest('a,input')) return;
    r={row,inner:row.querySelector('.hrow'),x:e.clientX,y:e.clientY,t:performance.now(),id:e.pointerId,on:false,dx:0,open:row.classList.contains('open')};
  });
  main.addEventListener('pointermove',e=>{
    if(!r||e.pointerId!==r.id) return; const dx=e.clientX-r.x+(r.open?-96:0), dy=e.clientY-r.y;
    if(!r.on){ if(Math.abs(e.clientX-r.x)>10&&Math.abs(e.clientX-r.x)>Math.abs(dy)*1.4){ r.on=true; r.inner.style.transition='none'; try{main.setPointerCapture(e.pointerId)}catch{} } else if(Math.abs(dy)>12) r=null; return }
    r.dx=Math.min(0,dx); const w=r.row.offsetWidth;
    r.inner.style.transform=`translate3d(${r.dx}px,0,0)`;
    r.row.classList.toggle('armed',r.dx<-w*.55);
  });
  const end=e=>{
    if(!r||e.pointerId!==r.id) return; const s=r; r=null; if(!s.on) return;
    const w=s.row.offsetWidth, v=(e.clientX-s.x)/Math.max(1,performance.now()-s.t);
    s.inner.style.transition='transform .3s cubic-bezier(.32,.72,0,1)';
    if(s.dx<-w*.55||(v<-.9&&s.dx<-60)){
      haptic(); s.inner.style.transform=`translate3d(${-w}px,0,0)`;
      const k=s.row.dataset.key; setTimeout(()=>collapseRow(s.row,()=>{ saveFact(k,{hunt:false}); toast('Marked found') }),180);
    } else if(s.dx<-48){ s.inner.style.transform='translate3d(-96px,0,0)'; s.row.classList.add('open') }
    else { s.inner.style.transform=''; s.row.classList.remove('open','armed') }
    const block=ev=>{ ev.stopPropagation(); ev.preventDefault() }; s.row.addEventListener('click',block,{capture:true,once:true}); setTimeout(()=>s.row.removeEventListener('click',block,{capture:true}),0);
  };
  main.addEventListener('pointerup',end); main.addEventListener('pointercancel',end);
  main.addEventListener('click',e=>{ const a=e.target.closest('.srow-act'); if(a){ const row=a.closest('.srow'); collapseRow(row,()=>{ saveFact(row.dataset.key,{hunt:false}); toast('Marked found') }) } });
}
// Bottom sheets (dialogs and the card menu on phones): drag down to dismiss.
function bindSheetDrag(sheet,close,canStart){
  let d=null;
  sheet.addEventListener('pointerdown',e=>{
    if(!matchMedia('(max-width:640px)').matches||e.pointerType==='mouse') return;
    if(!canStart(e)) return;
    d={y:e.clientY,t:performance.now(),id:e.pointerId,on:false,dy:0};
  });
  sheet.addEventListener('pointermove',e=>{
    if(!d||e.pointerId!==d.id) return; const dy=e.clientY-d.y;
    if(!d.on){ if(dy>8){ d.on=true; sheet.style.transition='none'; try{sheet.setPointerCapture(e.pointerId)}catch{} } else if(dy<-8) d=null; return }
    d.dy=Math.max(0,dy); sheet.style.transform=`translate3d(0,${d.dy}px,0)`;
  });
  const end=e=>{
    if(!d||e.pointerId!==d.id) return; const s=d; d=null; if(!s.on) return;
    const v=s.dy/Math.max(1,performance.now()-s.t);
    sheet.style.transition='transform .3s cubic-bezier(.32,.72,0,1)';
    if(s.dy>sheet.offsetHeight*.25||v>.6){ sheet.style.transform=`translate3d(0,${sheet.offsetHeight+40}px,0)`; setTimeout(()=>{ sheet.style.transition=''; close(true) },220) }
    else { sheet.style.transform=''; setTimeout(()=>sheet.style.transition='',300) }
  };
  sheet.addEventListener('pointerup',end); sheet.addEventListener('pointercancel',end);
}
bindSheetDrag(dlg,()=>{ flushNotes(); dlg.classList.add('closing'); clearTimeout(closeT); closeT=setTimeout(()=>{ dlg.classList.remove('closing'); dlg.style.transform=''; try{dlg.close()}catch{} body.innerHTML='' },0) },
  e=>dlg.scrollTop<=0&&!e.target.closest('input,textarea,select,.checks,.pick-list'));
document.addEventListener('pointerdown',e=>{ const m=e.target.closest?.('#cmenu'); if(m&&!m._drag){ m._drag=1; bindSheetDrag(m,()=>closeCardMenu(true),()=>true) } },true);
// Press feedback for SVG tree cards, which have no :active on touch.
document.addEventListener('pointerdown',e=>{ const c=e.target.closest?.('.card'); if(c){ c.classList.add('pressed'); const up=()=>{ c.classList.remove('pressed'); removeEventListener('pointerup',up); removeEventListener('pointercancel',up) }; addEventListener('pointerup',up); addEventListener('pointercancel',up) } });
bindSwipe(); bindRowSwipe();

/* ---------- boot ---------- */

async function getClaude(){ for(let i=0;i<30;i++){ if(window.claude?.use) return window.claude; await new Promise(r=>setTimeout(r,50)) } return null }
async function boot(){
  splash(); route();
  // this device's copy first, so the tree opens at once, with or without internet
  const had=loadMirror(); if(had){ MODE='cached'; READY=true }
  render(); loadLibrary(); loadLessons(); await loadLocalFiles();
  const c=await getClaude();
  if(c){ if(!await connect(c,had)&&!had){ loadLocal(); READY=true } try{ DL=await c.use('downloads') }catch{} }
  else { ENV='web'; webExtras();
    // without sync set up, this device's tree is the only copy: keep it in device-only mode
    if(!supaCfg()&&had&&!OUT.length){ MODE='local'; saveLocal(); try{ localStorage.removeItem(MIRROR) }catch{} }
    else if(!await connectSupabase(had)&&!had){ loadLocal(); READY=true } }
  syncUI(); scheduleRender();
}
// Running from your own website: offline app cache, so it opens with no internet.
function webExtras(){ if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')) navigator.serviceWorker.register('sw.js').catch(()=>{}) }
// Connect to the saved tree on claude.ai. Called at start, and again when the connection returns.
async function connect(c,had){
  if(DB||!c) return !!DB; let db=null, assets=null;
  try{ db=await c.use('db') }catch{}
  if(!db) return false;
  try{ assets=await c.use('assets') }catch{}
  return connectDb(db,assets,had);
}
async function connectDb(db,assets,had){
  DB=db; MODE='db'; ASSETS=assets||null; const pending=new Set(COLS);
  setTimeout(()=>{ if(!READY){ READY=true; scheduleRender() } },6000);
  for(const col of COLS){
    db.collection(col).onSnapshot(snap=>{
      // a partial view from the platform's own cache never replaces this device's fuller copy
      if(had&&snap.metadata?.fromCache&&snap.empty&&S[col].size) return;
      S[col]=new Map(snap.docs.map(d=>[d.id,d.data()]));
      for(const op of OUT) if(op.col===col) applyOp(op);   // unsent work stays in view
      if(!snap.metadata?.fromCache){ SYNC.online=true; SYNC.lastOk=Date.now() }
      persist(); pending.delete(col); if(!pending.size){ if(!READY) READY=true; onFirstSync() } if(READY) scheduleRender() },
      err=>{ console.warn(col,err); pending.delete(col); if(!pending.size){READY=true; scheduleRender()} });
  }
  flush(); flushFiles(); syncUI();
  return true;
}
// After first connecting a device that already held a tree, add what the account doesn't have yet.
let pushLocal=null;
function onFirstSync(){ const d=pushLocal; pushLocal=null; if(!d) return; let n=0;
  for(const c of COLS) for(const [id,v] of Object.entries(d[c]||{})) if(!S[c].has(id)){ put(c,id,v); n++ }
  if(n) toast(`Added ${n} records from this device to your account`) }
if(location.hostname==='localhost') window.__t={storeToGed,gedToStore,buildR,S};
boot();
})();
